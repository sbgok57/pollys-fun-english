  const NW=[['one','1️⃣'],['two','2️⃣'],['three','3️⃣'],['four','4️⃣'],['five','5️⃣'],['six','6️⃣'],['seven','7️⃣'],['eight','8️⃣'],['nine','9️⃣'],['ten','🔟']];
  const R=10;let i=0;
  const round=()=>{ if(i>=R){api.end({score:api.score,max:R*10,note:'Sayma şampiyonu! 🔢'});return}
    const n=1+rnd(cfg.max);const w=pick(EW);api.progress(i+1,R);
    const correct=NW[n-1];
    const others=sample(NW.filter(x=>x!==correct),cfg.n-1);
    const opts=shuffle([correct,...others]);
    api.root.innerHTML=`<div class="center">
      <div class="prompt-box"><div class="pw">How many? 🔍</div>
        <div class="pw" style="font-size:clamp(34px,7vw,52px);letter-spacing:6px">${w[1].repeat(n)}</div></div>
      <div class="opt-grid">${opts.map(o=>`<div class="opt txt" data-ok="${o===correct?1:0}">
        <span class="ow" style="font-size:1.5em">${o[1]} ${esc(o[0])}</span></div>`).join('')}</div></div>`;
    MEDIA.speak('How many?');
    let locked = false;
    api.root.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      if(locked) return;
      if(o.dataset.ok==='1'){
        locked = true;
        o.classList.add('ok');MEDIA.fx('correct');FX.fb(true);MEDIA.speak(correct[0]+'!');api.add(10);i++;setTimeout(round,900);
      } else {
        locked = true;
        o.classList.add('no');MEDIA.fx('wrong');
        api.root.querySelectorAll('.opt').forEach(x=>{if(x.dataset.ok==='1')x.classList.add('ok')});
        setTimeout(()=>{i++;round()},1400);
      }
    });
  };round();
 }},

  /* ---------------- 25) ✍️ HARF & KELİME ÇİZME (TRACING) ---------------- */
  {
    id: 'trace',
    e: '✍️',
    t: 'Harf & Kelime Çizme',
    d: 'Harflerin ve kelimelerin üzerinden geç, doğru yazmayı öğren!',
    stages: [1, 2],
    levels: [
      { n: 'Harf Harf (Büyük Harf)', c: { mode: 'letter', count: 6 } },
      { n: 'Tüm Kelime (Kılavuz Çizgili)', c: { mode: 'word', count: 6 } },
      { n: 'Serbest Çizim (Kılavuz Çizgili)', c: { mode: 'free', count: 6 } }
    ],
    init(api) {
      const u = api.unit;
      const cfg = api.lv || {};
      const EW = EWORDS(u);
      const pool = shuffle(EW.length ? EW : [['STAR', '⭐', 'Yıldız', 0]]).slice(0, cfg.count || 6);
      let wordIdx = 0;
      let letterIdx = 0;
      const totalRounds = pool.length;

      let currentColor = '#8b5cf6';
      let isRainbow = false;
      let rainbowHue = 0;
      let brushSize = 18;
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;
      let checkpoints = [];
      const coveredPoints = new Set();
      let hasCompleted = false;

      const renderRound = () => {
        if (wordIdx >= totalRounds) {
          // // SAFETY / USER-REQ: Puan veya yıldız yok, saf teşvik ve tebrik mesajı
          api.end({ score: totalRounds, max: totalRounds, note: 'Harika bir çalışma! Tüm harfleri başarıyla yazdın! ✍️🎉' });
          return;
        }
        hasCompleted = false;
        coveredPoints.clear();
        checkpoints = [];

        const curWord = pool[wordIdx];
        const wordText = String(curWord[0] || '').toUpperCase();
        const wordEmoji = curWord[1] || '✍️';
        const wordTr = curWord[2] || '';

        const isLetterMode = cfg.mode === 'letter';
        const activeChar = isLetterMode ? (wordText[letterIdx] || wordText[0]) : wordText;

        api.progress(wordIdx + 1, totalRounds);

        api.root.innerHTML = `
          <div class="trace-box">
            <div class="trace-header">
              <div class="trace-word-info">
                <span class="emoji">${wordEmoji}</span>
                <div>
                  <span style="font-size:1.15em;letter-spacing:1px">${esc(curWord[0])}</span>
                  <span class="muted" style="font-size:0.75em;margin-left:6px">(${esc(wordTr)})</span>
                  ${isLetterMode ? `<span class="badge purple" style="margin-left:8px">Harf ${letterIdx + 1}/${wordText.length}: <b>${activeChar}</b></span>` : ''}
                </div>
              </div>
              <div class="trace-guide-wrap">
                <span class="trace-badge" id="t-status">✏️ Harfin üzerinden geç</span>
              </div>
            </div>

            <div class="trace-canvas-wrap" id="tcw">
              <canvas class="trace-canvas" id="tcv"></canvas>
            </div>

            <div class="trace-toolbar">
              <div class="trace-palette">
                <button class="trace-color active" data-color="#8b5cf6" style="background:#8b5cf6" title="Mor"></button>
                <button class="trace-color" data-color="#0ea5e9" style="background:#0ea5e9" title="Mavi"></button>
                <button class="trace-color" data-color="#10b981" style="background:#10b981" title="Yeşil"></button>
                <button class="trace-color" data-color="#f97316" style="background:#f97316" title="Turuncu"></button>
                <button class="trace-color" data-color="#ec4899" style="background:#ec4899" title="Pembe"></button>
                <button class="trace-color" data-color="rainbow" style="background:linear-gradient(135deg,red,orange,yellow,green,blue,indigo,violet)" title="Gökkuşağı"></button>
              </div>
              <div class="trace-actions">
                <button class="btn small white" id="t-spk" title="Seslendir">🔊 Dinle</button>
                <button class="btn small white" id="t-clr" title="Temizle">🗑️ Temizle</button>
                <button class="btn small green" id="t-nxt" title="Sonraki">Sonraki ➡️</button>
              </div>
            </div>
          </div>
        `;

        if (isLetterMode) {
          MEDIA.speak(activeChar);
        } else {
          MEDIA.speak(curWord[0]);
        }

        const canvas = api.root.querySelector('#tcv');
        const wrap = api.root.querySelector('#tcw');
        const statusEl = api.root.querySelector('#t-status');
        if (!canvas || !canvas.getContext) return; // // SAFETY: Headless/test fallback

        const ctx = canvas.getContext('2d');
        if (!ctx) return; // // SAFETY: Missing 2d context guard

        const setupCanvasSize = () => {
          const rect = wrap ? wrap.getBoundingClientRect() : { width: 560, height: 280 };
          const dpr = typeof window !== 'undefined' && window.devicePixelRatio ? Math.min(window.devicePixelRatio, 2) : 1;
          const w = rect.width > 50 ? rect.width : 560;
          const h = rect.height > 50 ? rect.height : 280;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          if (ctx.resetTransform) ctx.resetTransform();
          if (ctx.scale) ctx.scale(dpr, dpr);
          return { w, h };
        };

        const dim = setupCanvasSize();
        const W = dim.w;
        const H = dim.h;

        const drawBackground = () => {
          if (!ctx.clearRect) return;
          ctx.clearRect(0, 0, W, H);

          const yTop = H * 0.22;
          const yMid = H * 0.44;
          const yBase = H * 0.72;
          const yBot = H * 0.90;

          if (ctx.beginPath) {
            // Top line
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1.5;
            if (ctx.setLineDash) ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(16, yTop);
            ctx.lineTo(W - 16, yTop);
            ctx.stroke();

            // Mid dashed line
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;
            if (ctx.setLineDash) ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(16, yMid);
            ctx.lineTo(W - 16, yMid);
            ctx.stroke();
            if (ctx.setLineDash) ctx.setLineDash([]);

            // Baseline (solid coral line)
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(16, yBase);
            ctx.lineTo(W - 16, yBase);
            ctx.stroke();

            // Bottom line (descender)
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(16, yBot);
            ctx.lineTo(W - 16, yBot);
            ctx.stroke();
          }
        };

        const drawTemplate = () => {
          if (!ctx.strokeText || !ctx.fillText) return;
          ctx.save && ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';

          let fontSize = H * 0.48;
          const yPos = H * 0.72;

          if (isLetterMode) {
            fontSize = Math.min(H * 0.65, 170);
            ctx.font = `900 ${fontSize}px "Comic Sans MS", "Chalkboard SE", "Nunito", sans-serif`;
          } else {
            fontSize = Math.min(H * 0.42, 95);
            ctx.font = `900 ${fontSize}px "Comic Sans MS", "Chalkboard SE", "Nunito", sans-serif`;
          }

          ctx.strokeStyle = cfg.mode === 'free' ? 'rgba(203, 213, 225, 0.35)' : '#94a3b8';
          ctx.lineWidth = isLetterMode ? 8 : 5;
          if (ctx.setLineDash) ctx.setLineDash([8, 6]);
          ctx.strokeText(activeChar, W / 2, yPos);

          ctx.fillStyle = 'rgba(241, 245, 249, 0.55)';
          ctx.fillText(activeChar, W / 2, yPos);
          if (ctx.setLineDash) ctx.setLineDash([]);
          ctx.restore && ctx.restore();

          if (checkpoints.length === 0) {
            const stepX = isLetterMode ? 14 : 20;
            const stepY = 16;
            const startX = W * 0.20;
            const endX = W * 0.80;
            const startY = H * 0.24;
            const endY = H * 0.74;
            let idCount = 0;
            for (let px = startX; px <= endX; px += stepX) {
              for (let py = startY; py <= endY; py += stepY) {
                checkpoints.push({ id: idCount++, x: px, y: py });
              }
            }
          }
        };

        drawBackground();
        drawTemplate();

        const getPos = (e) => {
          const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
          return {
            x: (e.clientX || 0) - r.left,
            y: (e.clientY || 0) - r.top
          };
        };

        const checkHit = (x, y) => {
          if (hasCompleted || !checkpoints.length) return;
          const radius = brushSize * 1.5;
          for (let k = 0; k < checkpoints.length; k++) {
            const cp = checkpoints[k];
            if (!coveredPoints.has(cp.id)) {
              const dx = cp.x - x;
              const dy = cp.y - y;
              if (dx * dx + dy * dy <= radius * radius) {
                coveredPoints.add(cp.id);
              }
            }
          }

          // // PERF / SAFETY / USER-REQ: Esnek harf algılama — tüm boşlukları boyamaya gerek yok!
          // Öğrencinin harfin üzerinden bir miktar geçmesi yeterlidir, puan/yıldız baskısı yok.
          const minHits = Math.min(5, Math.max(3, Math.floor(checkpoints.length * 0.12)));
          if (coveredPoints.size >= minHits && !hasCompleted) {
            hasCompleted = true;
            if (statusEl) {
              statusEl.innerHTML = '✨ Harika yazdın! 👏';
              statusEl.classList.add('success');
            }
            MEDIA.fx('correct');
            FX.confetti(22);
            const praiseList = ['Super!', 'Great writing!', 'Well done!', 'Awesome!'];
            MEDIA.speak(praiseList[Math.floor(Math.random() * praiseList.length)]);

            setTimeout(() => {
              if (isLetterMode && letterIdx < wordText.length - 1) {
                letterIdx++;
              } else {
                letterIdx = 0;
                wordIdx++;
              }
              renderRound();
            }, 900);
          }
        };

        const startDraw = (e) => {
          e.preventDefault && e.preventDefault();
          isDrawing = true;
          const p = getPos(e);
          lastX = p.x;
          lastY = p.y;
          checkHit(p.x, p.y);
        };

        const moveDraw = (e) => {
          if (!isDrawing) return;
          e.preventDefault && e.preventDefault();
          const p = getPos(e);

          if (ctx.beginPath && ctx.moveTo && ctx.lineTo && ctx.stroke) {
            ctx.save && ctx.save();
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(p.x, p.y);

            if (isRainbow) {
              rainbowHue = (rainbowHue + 4) % 360;
              ctx.strokeStyle = `hsl(${rainbowHue}, 90%, 55%)`;
            } else {
              ctx.strokeStyle = currentColor;
            }

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore && ctx.restore();
          }

          lastX = p.x;
          lastY = p.y;
          checkHit(p.x, p.y);
        };

        const stopDraw = () => {
          isDrawing = false;
          if (!hasCompleted && coveredPoints.size >= 3) {
            checkHit(lastX, lastY);
          }
        };

        canvas.addEventListener('pointerdown', startDraw);
        canvas.addEventListener('pointermove', moveDraw);
        canvas.addEventListener('pointerup', stopDraw);
        canvas.addEventListener('pointercancel', stopDraw);

        api.root.querySelectorAll('.trace-color').forEach((b) => {
          b.onclick = () => {
            api.root.querySelectorAll('.trace-color').forEach((x) => x.classList.remove('active'));
            b.classList.add('active');
            const col = b.dataset.color;
            if (col === 'rainbow') {
              isRainbow = true;
            } else {
              isRainbow = false;
              currentColor = col;
            }
            MEDIA.fx('click');
          };
        });

        const spkBtn = api.root.querySelector('#t-spk');
        if (spkBtn) {
          spkBtn.onclick = () => {
            MEDIA.fx('click');
            if (isLetterMode) MEDIA.speak(activeChar);
            else MEDIA.speak(curWord[0]);
          };
        }

        const clrBtn = api.root.querySelector('#t-clr');
        if (clrBtn) {
          clrBtn.onclick = () => {
            if (hasCompleted) return;
            MEDIA.fx('whoosh');
            coveredPoints.clear();
            if (statusEl) {
              statusEl.innerHTML = '✏️ Harfin üzerinden geç';
              statusEl.classList.remove('success');
            }
            hasCompleted = false;
            drawBackground();
            drawTemplate();
          };
        }

        const nxtBtn = api.root.querySelector('#t-nxt');
        if (nxtBtn) {
          nxtBtn.onclick = () => {
            if (hasCompleted) return;
            MEDIA.fx('click');
            if (isLetterMode && letterIdx < wordText.length - 1) {
              letterIdx++;
            } else {
              letterIdx = 0;
              wordIdx++;
            }
            renderRound();
          };
        }
      };

      renderRound();
    }
  },

  /* ---------------- 26) 🧩 BAAMBOOZLE TAKIM & SINIF OYUNU ---------------- */
  {
    id: 'baamboozle',
    e: '🧩',
    t: 'Baamboozle Takım Oyunu',
    d: 'Sınıf & Akıllı Tahta Yarışması! 2 Takım, gizemli kartlar ve sürpriz güçler!',
    stages: [1, 2],
    levels: [
      { n: '16 Kart (Klasik 4x4)', c: { tiles: 16 } },
      { n: '20 Kart (Orta 5x4)', c: { tiles: 20 } },
      { n: '24 Kart (Geniş 6x4)', c: { tiles: 24 } }
    ],
    init(api) {
      const u = api.unit, cfg = api.lv;
      const count = Math.min(cfg.tiles, 24);
      const pool = shuffle([...u.w]);

      let team1Score = 0, team2Score = 0;
      let activeTeam = 1; // 1: Red, 2: Blue
      let openedCount = 0;
      let isModalOpen = false;

      const powerUpTypes = [
        { type: 'swap', title: '⚡ PUANLARI TAKAS ET!', desc: 'İki takımın puanları yer değiştirdi!', icon: '⚡', action: () => { const tmp = team1Score; team1Score = team2Score; team2Score = tmp; MEDIA.fx('whoosh'); FX.confetti(25); } },
        { type: 'gift', title: '🎁 SÜRPRİZ HEDİYE!', desc: 'Tebrikler! Takımına +25 bedava puan!', icon: '🎁', action: (tm) => { if(tm===1) team1Score += 25; else team2Score += 25; MEDIA.fx('win'); FX.stars(); } },
        { type: 'trap', title: '💥 EYVAH! KÜÇÜK TUZAK!', desc: 'Dikkat! Takımın 10 puan kaybetti!', icon: '💥', action: (tm) => { if(tm===1) team1Score = Math.max(0, team1Score - 10); else team2Score = Math.max(0, team2Score - 10); MEDIA.fx('wrong'); } },
        { type: 'share', title: '🤝 DOSTLUK PAYLAŞIMI!', desc: 'Diğer takıma +15 puan hediye ettiniz!', icon: '🤝', action: (tm) => { if(tm===1) team2Score += 15; else team1Score += 15; MEDIA.fx('magic'); FX.stars(); } }
      ];

      const deck = [];
      for (let i = 0; i < count; i++) {
        if (i > 0 && i % 4 === 2) {
          const pu = pick(powerUpTypes);
          deck.push({ isPower: true, ...pu, opened: false });
        } else {
          const w = pool[i % pool.length];
          deck.push({ isPower: false, w, opened: false });
        }
      }

      const renderBoard = () => {
        api.root.innerHTML = `
          <div class="baamboozle-wrap">
            <div class="baamboozle-scoreboard">
              <div class="bb-team t1 ${activeTeam === 1 ? 'active' : ''}">
                <div class="bb-team-name">🔴 Kırmızı Takım</div>
                <div class="bb-team-score" id="b-t1">${team1Score}</div>
              </div>
              <div class="bb-turn-pill" id="b-turn">
                <span class="team-dot ${activeTeam === 1 ? 'red' : 'blue'}"></span>
                ${activeTeam === 1 ? '🔴 Kırmızı Takım' : '🔵 Mavi Takım'} Sırası
              </div>
              <div class="bb-team t2 ${activeTeam === 2 ? 'active' : ''}">
                <div class="bb-team-name">🔵 Mavi Takım</div>
                <div class="bb-team-score" id="b-t2">${team2Score}</div>
              </div>
            </div>

            <div class="baamboozle-grid">
              ${deck.map((card, i) => `
                <div class="bb-tile ${card.opened ? 'opened ' + (card.wonTeam === 1 ? 'by-t1' : card.wonTeam === 2 ? 'by-t2' : 'neutral') : ''}" data-idx="${i}">
                  <span class="bb-num">${i + 1}</span>
                  ${card.opened ? `<span class="bb-tile-icon">${card.isPower ? card.icon : card.w[1]}</span>` : ''}
                </div>
              `).join('')}
            </div>
            <div id="bb-modal-mount"></div>
          </div>
        `;
        api.progress(openedCount, count);
        bindBoard();
      };

      const openTile = (idx) => {
        if (isModalOpen) return;
        const card = deck[idx];
        if (!card || card.opened) return;
        isModalOpen = true;
        MEDIA.fx('pop');

        const mount = api.root.querySelector('#bb-modal-mount');
        if (!mount) return;

        if (card.isPower) {
          card.opened = true;
          card.wonTeam = activeTeam;
          card.action(activeTeam);
          openedCount++;

          mount.innerHTML = `
            <div class="bb-modal-overlay">
              <div class="bb-modal-box power-box">
                <div class="bb-power-icon anim-bounce" style="font-size:4.5em">${card.icon}</div>
                <h2>${card.title}</h2>
                <p style="font-size:1.25em;margin:12px 0 20px;color:#334155">${card.desc}</p>
                <button class="btn green big" id="bb-power-ok" style="font-size:1.2em;padding:12px 30px">Harika! Devam Et ➡️</button>
              </div>
            </div>
          `;
          api.root.querySelector('#bb-power-ok').onclick = () => {
            MEDIA.fx('click');
            isModalOpen = false;
            activeTeam = activeTeam === 1 ? 2 : 1;
            checkGameEnd();
            renderBoard();
          };
          return;
        }

        const w = card.w;
        mount.innerHTML = `
          <div class="bb-modal-overlay">
            <div class="bb-modal-box">
              <div class="bb-modal-badge">${activeTeam === 1 ? '🔴 Kırmızı Takım' : '🔵 Mavi Takım'} — Kart ${idx + 1}</div>
              
              <div class="bb-stage-visual">
                <span class="bb-huge-emoji popflash" style="font-size:5.5em">${w[1] || '🔤'}</span>
              </div>
              <div class="bb-stage-prompt" id="bb-prompt">
                <div class="pw" style="font-size:1.5em;color:#1e293b">Bu kelimenin İngilizcesi nedir? 🗣️</div>
                <div class="muted" style="margin-top:6px;font-size:1.15em;font-weight:700">${esc(w[2])}</div>
              </div>

              <div id="bb-answer-revealed" style="display:none;margin:12px 0 16px">
                <div class="pw" style="font-size:2.2em;color:#7c3aed;font-weight:900">${esc(w[0])}</div>
                <div style="font-size:1.3em;color:#059669;font-weight:700">(${esc(w[2])})</div>
                <button class="btn small blue" id="bb-spk-btn" style="margin-top:8px">🔊 Telaffuz Dinle</button>
              </div>

              <div class="row" style="margin-top:20px;gap:12px;justify-content:center" id="bb-actions">
                <button class="btn purple big" id="bb-show-ans" style="font-size:1.15em;padding:12px 24px">👁️ Cevabı Göster</button>
              </div>
            </div>
          </div>
        `;

        api.root.querySelector('#bb-show-ans').onclick = () => {
          MEDIA.fx('magic');
          MEDIA.speak(w[0]);
          const ansEl = api.root.querySelector('#bb-answer-revealed');
          const actionsEl = api.root.querySelector('#bb-actions');
          if (ansEl) ansEl.style.display = 'block';
          api.root.querySelector('#bb-spk-btn').onclick = () => MEDIA.speak(w[0]);

          if (actionsEl) {
            actionsEl.innerHTML = `
              <button class="btn green big" id="bb-ans-ok" style="font-size:1.1em;padding:12px 22px">✅ Doğru Bildi (+15 Puan)</button>
              <button class="btn white big" id="bb-ans-no" style="font-size:1.1em;padding:12px 22px">❌ Pas / Yanlış (0 Puan)</button>
            `;
            api.root.querySelector('#bb-ans-ok').onclick = () => {
              card.opened = true;
              card.wonTeam = activeTeam;
              if (activeTeam === 1) team1Score += 15; else team2Score += 15;
              MEDIA.fx('correct');
              FX.stars();
              openedCount++;
              isModalOpen = false;
              activeTeam = activeTeam === 1 ? 2 : 1;
              checkGameEnd();
              renderBoard();
            };
            api.root.querySelector('#bb-ans-no').onclick = () => {
              card.opened = true;
              card.wonTeam = 0;
              MEDIA.fx('wrong');
              openedCount++;
              isModalOpen = false;
              activeTeam = activeTeam === 1 ? 2 : 1;
              checkGameEnd();
              renderBoard();
            };
          }
        };
      };

      const checkGameEnd = () => {

                🎵 4. Şarkılar & Karaoke
              </button>
              <button class="cam-nav-tab ${this.activeTab === 'videos' ? 'active' : ''}" data-tab="videos">
                📺 5. Eğitici Video Kütüphanesi
              </button>
              <button class="cam-nav-tab ${this.activeTab === 'lesson' ? 'active' : ''}" data-tab="lesson">
                📋 6. Öğretmen Rehberi & Ders Planı
              </button>
            </nav>
          </header>

          <!-- 2. MAIN ACTIVE VIEW CONTENT -->
          <main class="cambridge-main-content">
            ${this.renderActiveTabContent(unit)}
          </main>

          <!-- 3. BAAMBOOZLE QUESTION MODAL -->
          ${this.baam.activeModal ? this.renderBaamModal() : ''}
        </div>
      `;

      this.container.innerHTML = html;
      this.bindEvents();
    },

    renderActiveTabContent(unit) {
      if (!unit && this.activeTab !== 'twisters' && this.activeTab !== 'songs' && this.activeTab !== 'videos') {
        return `<div class="cam-empty">Bu aşama için ünite bulunamadı.</div>`;
      }
      switch (this.activeTab) {
        case 'vocab': return this.renderVocabView(unit);
        case 'baamboozle': return this.renderBaamboozleView(unit);
        case 'twisters': return this.renderTwistersView();
        case 'songs': return this.renderSongsView();
        case 'videos': return this.renderVideosView();
        case 'lesson': return this.renderLessonView(unit);
        default: return this.renderVocabView(unit);
      }
    },

    /* ============================================================
       VIEW 1: VOCABULARY DUAL MEDIA (GIF & REAL PHOTO)
       ============================================================ */
    renderVocabView(unit) {
      const words = unit.vocabulary || [];
      return `
        <div class="cam-vocab-section">
          <div class="cam-section-banner">
            <div>
              <h2>🌟 Unit ${unit.number}: ${unit.title} — Kelime Keşfi</h2>
              <p>Yapay zeka emojisi yerine çocuklara yönelik <b>hareketli GIPHY GIF'leri</b> ve <b>gerçek yüksek çözünürlüklü fotoğraflar</b> kullanılmıştır.</p>
            </div>
            <div class="cam-mode-indicator">
              Aktif Görünüm: <b>${this.mediaMode === 'gif' ? '🎬 Canlı GIF Modu' : '📷 Gerçek Fotoğraf Modu'}</b>
            </div>
          </div>

          <div class="cam-vocab-grid">
            ${words.map((item, idx) => {
              const mediaSrc = this.mediaMode === 'gif' ? item.gifUrl : item.realPhoto;
              const charName = (item.characterVoice || 'polly').toUpperCase();
              return `
                <div class="cam-vocab-card">
                  <div class="cam-card-media-wrap">
                    <img src="${mediaSrc}" alt="${item.word}" class="cam-vocab-img" loading="lazy" />
                    <span class="cam-char-badge">${charName}</span>
                    <button class="cam-speak-btn" data-word="${item.word}" data-char="${item.characterVoice || 'polly'}" title="Dinle">
                      🔊
                    </button>
                  </div>
                  <div class="cam-card-body">
                    <h3 class="cam-word-title">${item.word}</h3>
                    <div class="cam-word-tr">🇹🇷 ${item.turkish}</div>
                    <div class="cam-word-def">📖 ${item.meaning}</div>
                    <div class="cam-char-quote">
                      <i>💬 "${item.voiceLine || item.word}"</i>
                      <button class="cam-quote-speak-btn" data-text="${item.voiceLine || item.word}" data-char="${item.characterVoice || 'polly'}">
                        🗣️ Karakter Sesiyle Oku
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    },

    /* ============================================================
       VIEW 2: BAAMBOOZLE 4-TEAM SMARTBOARD ARENA
       ============================================================ */
    renderBaamboozleView(unit) {
      const currentTeamName = this.baam.teamNames[this.baam.turn % this.baam.teamsCount];
      const remainingTiles = this.baam.tiles.filter(t => !t.done).length;

      return `
        <div class="cam-baam-arena">
          <!-- TOP ARENA BAR: TEAMS & SCOREBOARD -->
          <div class="cam-arena-header">
            <div class="cam-team-selector">
              <span>👥 Takım Sayısı:</span>
              <button class="cam-team-btn ${this.baam.teamsCount === 2 ? 'active' : ''}" data-tcount="2">2 Takım</button>
              <button class="cam-team-btn ${this.baam.teamsCount === 3 ? 'active' : ''}" data-tcount="3">3 Takım</button>
              <button class="cam-team-btn ${this.baam.teamsCount === 4 ? 'active' : ''}" data-tcount="4">4 Takım</button>
              <button class="cam-team-btn reset" id="cam-baam-reset">🔄 Oyunu Sıfırla</button>
            </div>
            <div class="cam-turn-indicator">
              Sıradaki Takım: <b class="cam-active-team-name">${currentTeamName}</b>
            </div>
          </div>

          <!-- SCOREBOARD CARDS -->
          <div class="cam-scoreboard">
            ${Array.from({ length: this.baam.teamsCount }).map((_, i) => {
              const isTurn = (this.baam.turn % this.baam.teamsCount) === i;
              return `
                <div class="cam-team-card team-${i} ${isTurn ? 'is-turn' : ''}">
                  <div class="cam-tc-title">${this.baam.teamNames[i]}</div>
                  <div class="cam-tc-score">${this.baam.teamScores[i]} <small>PTS</small></div>
                  ${isTurn ? '<div class="cam-tc-badge">Sıra Sende! 🔥</div>' : ''}
                </div>
              `;
            }).join('')}
          </div>

          <!-- 16 TILES SMARTBOARD GRID -->
          <div class="cam-tiles-grid">
            ${this.baam.tiles.map((t, idx) => {
              if (t.done) {
                return `
                  <div class="cam-tile done">
                    <span class="cam-tile-check">✔</span>
                    <span class="cam-tile-done-pts">${t.question.pts > 0 ? '+' : ''}${t.question.pts}</span>
                  </div>
                `;
              }
              return `
                <button class="cam-tile openable" data-tileidx="${idx}">
                  <span class="cam-tile-num">${t.idx}</span>
                  <span class="cam-tile-sparkle">✨</span>
                </button>
              `;
            }).join('')}
          </div>

          ${remainingTiles === 0 ? `
            <div class="cam-game-over-banner">
              <h2>🏆 OYUN BİTTİ! TEBRİKLER! 🏆</h2>
              <p>Tüm kutular açıldı! Şampiyon takımı alkışlayalım!</p>
              <button class="cam-btn-reset-big" id="cam-baam-play-again">🎉 Tekrar Oyna</button>
            </div>
          ` : ''}
        </div>
      `;
    },

    // BAAMBOOZLE QUESTION MODAL
    renderBaamModal() {
      const modal = this.baam.activeModal;
      if (!modal) return '';
      const q = modal.tile.question;
      const type = q.type || 'question';
      const pts = q.pts || 15;
      const isBonus = type === 'bonus';
      const isPenalty = type === 'penalty';
      const isSteal = type === 'steal';
      const isSwap = type === 'swap';
      const isAction = type === 'action';

      return `
        <div class="cam-modal-backdrop">
          <div class="cam-modal-box ${type}">
            <div class="cam-modal-top">
              <span class="cam-modal-type-badge">${type.toUpperCase()}</span>
              <span class="cam-modal-pts-badge">${pts > 0 ? '+' : ''}${pts} PUAN</span>
            </div>

            <div class="cam-modal-q-text">
              ${q.q}
            </div>

            <div class="cam-modal-a-box ${modal.showAnswer ? 'revealed' : 'hidden'}">
              <div class="cam-modal-a-label">Doğru Cevap:</div>
              <div class="cam-modal-a-text">${q.a}</div>
            </div>

            <div class="cam-modal-actions">
              ${!modal.showAnswer ? `
                <button class="cam-mbtn show-ans" id="cam-btn-show-ans">
                  👁️ Cevabı Göster
                </button>
              ` : `
                ${isBonus || isPenalty || isAction ? `
                  <button class="cam-mbtn ok" id="cam-btn-award-mystery">
                    👍 Tamam (${pts > 0 ? '+' : ''}${pts} Pts)
                  </button>
                ` : isSteal ? `
                  <button class="cam-mbtn steal" id="cam-btn-do-steal">
                    🦹 Puanı Çal (+${pts} Pts)
                  </button>
                ` : isSwap ? `
                  <button class="cam-mbtn swap" id="cam-btn-do-swap">
                    🔄 Puanları Takas Et!
                  </button>
                ` : `
                  <button class="cam-mbtn ok" id="cam-btn-award-correct">
                    ✅ Doğru (+${pts} Puan)
                  </button>
                  <button class="cam-mbtn wrong" id="cam-btn-award-wrong">
                    ❌ Yanlış (0 Puan)
                  </button>
                `}
              `}
              <button class="cam-mbtn close" id="cam-btn-close-modal">✖ İptal</button>
            </div>
          </div>
        </div>
      `;
    },

    /* ============================================================
       VIEW 3: TONGUE TWISTERS (TEKERLEMELER)
       ============================================================ */
    renderTwistersView() {
      const data = (typeof TONGUE_TWISTERS_DATA !== 'undefined' ? TONGUE_TWISTERS_DATA : (window.TONGUE_TWISTERS_DATA || []));
      const filtered = data.filter(item => {
        if (this.twisterFilter) {
          const q = this.twisterFilter.toLowerCase();
          return item.twister.toLowerCase().includes(q) || item.targetPhonics.toLowerCase().includes(q) || item.meaningTr.toLowerCase().includes(q);
        }
        return true;
      });

      return `
        <div class="cam-twisters-section">
          <div class="cam-section-banner">
            <div>
              <h2>👅 Phonics & Tongue Twisters (Tekerleme Şenliği)</h2>
              <p>500+ tekerleme havuzundan müfredata uygun akıcılık ve telaffuz çalışmaları. Hızı seçip Polly ile birlikte söyleyin!</p>
            </div>
            <div class="cam-twister-controls">
              <span class="cam-speed-label">Ses Hızı:</span>
              <button class="cam-sp-btn ${this.twisterSpeed === 0.8 ? 'active' : ''}" data-speed="0.8">🐢 0.8x (Yavaş)</button>
              <button class="cam-sp-btn ${this.twisterSpeed === 1.0 ? 'active' : ''}" data-speed="1.0">🚶 1.0x (Normal)</button>
              <button class="cam-sp-btn ${this.twisterSpeed === 1.25 ? 'active' : ''}" data-speed="1.25">🚀 1.25x (Hızlı)</button>
            </div>
          </div>

          <div class="cam-search-row">
            <input type="text" id="cam-twister-search" class="cam-input" placeholder="🔍 Tekerleme veya ses ara (örn: p, sea, wood...)" value="${this.twisterFilter || ''}" />
            <span class="cam-tw-count">${filtered.length} tekerleme listelendi</span>
          </div>

          <div class="cam-twisters-grid">
            ${filtered.map(tw => `
              <div class="cam-twister-card">
                <div class="cam-tw-header">
                  <span class="cam-tw-stage">${tw.stage}</span>
                  <span class="cam-tw-phonics">🎯 Hedef Ses: <b>${tw.targetPhonics}</b></span>
                </div>
                <div class="cam-tw-body">
                  <p class="cam-tw-text">"${tw.twister}"</p>
                  <p class="cam-tw-tr">🇹🇷 ${tw.meaningTr}</p>
                </div>
                <div class="cam-tw-footer">
                  <button class="cam-btn-speak-twister" data-text="${tw.twister}">
                    🔊 Dinle & Tekrar Et (${this.twisterSpeed}x)
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    },

    /* ============================================================
       VIEW 4: SONGS & KARAOKE (ŞARKILAR & CHANT)
       ============================================================ */
    renderSongsView() {
      const songs = (typeof SONGS_DATA !== 'undefined' ? SONGS_DATA : (window.SONGS_DATA || []));
      return `
        <div class="cam-songs-section">
          <div class="cam-section-banner">
            <div>
              <h2>🎵 Cambridge Curriculum Songs & Chants</h2>
              <p>Müfredata uyumlu akılda kalıcı şarkılar. Web Audio akustik melodi kutusu eşliğinde sınıfça söyleyin!</p>
            </div>
            <div>
              <button class="cam-btn-music-big ${BackgroundMusicPlayer.isPlaying ? 'playing' : ''}" id="cam-songs-bg-music">
                ${BackgroundMusicPlayer.isPlaying ? '⏹️ Melodiyi Durdur' : '▶️ Akustik Arka Plan Müziği Çal'}
              </button>
            </div>
          </div>

          <div class="cam-songs-grid">
            ${songs.map(song => `
              <div class="cam-song-card">
                <div class="cam-song-top">
                  <span class="cam-song-stage">${song.stage}</span>
                  <span class="cam-song-theme">💡 ${song.theme}</span>
                </div>
                <h3 class="cam-song-title">🎶 ${song.title}</h3>
                <div class="cam-song-lyrics-box">
                  <pre class="cam-song-lyrics">${song.lyrics}</pre>
                </div>
                <div class="cam-song-footer">
                  <button class="cam-btn-sing-along" data-lyrics="${encodeURIComponent(song.lyrics)}">
                    🎤 Polly ile Satır Satır Söyle
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    },

    /* ============================================================
       VIEW 5: EDUCATIONAL VIDEO LIBRARY (YOUTUBE EMBEDS)
       ============================================================ */
    renderVideosView() {
      const videos = (typeof VIDEO_LIBRARY_DATA !== 'undefined' ? VIDEO_LIBRARY_DATA : (window.VIDEO_LIBRARY_DATA || []));
      const filtered = videos.filter(v => {
        if (this.videoFilter === 'all') return true;
        return v.stage.toLowerCase() === this.videoFilter.toLowerCase();
      });

      return `
        <div class="cam-videos-section">
          <div class="cam-section-banner">
            <div>
              <h2>📺 Cambridge Educational Video Library</h2>
              <p>Özenle seçilmiş, çocuklara uygun, telif kurallarına saygılı YouTube gömülü video dersleri.</p>
            </div>
            <div class="cam-video-filters">
              <button class="cam-vf-btn ${this.videoFilter === 'all' ? 'active' : ''}" data-vfilter="all">Tümü (${videos.length})</button>
              <button class="cam-vf-btn ${this.videoFilter === 'stage 1' ? 'active' : ''}" data-vfilter="stage 1">Stage 1</button>
              <button class="cam-vf-btn ${this.videoFilter === 'stage 2' ? 'active' : ''}" data-vfilter="stage 2">Stage 2</button>
              <button class="cam-vf-btn ${this.videoFilter === 'stage 3' ? 'active' : ''}" data-vfilter="stage 3">Stage 3</button>
              <button class="cam-vf-btn ${this.videoFilter === 'stage 4' ? 'active' : ''}" data-vfilter="stage 4">Stage 4</button>
            </div>
          </div>

          <div class="cam-videos-grid">
            ${filtered.map(v => `
              <div class="cam-video-card">
                <div class="cam-video-iframe-wrap">
                  <iframe 
                    src="${v.embedUrl}" 
                    title="${v.title}" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen 
                    loading="lazy">
                  </iframe>
                </div>
                <div class="cam-video-info">
                  <div class="cam-v-badges">
                    <span class="cam-v-stage">${v.stage}</span>
                    <span class="cam-v-dur">⏱️ ${v.duration}</span>
                  </div>
                  <h4 class="cam-v-title">${v.title}</h4>
                  <div class="cam-v-chan">📺 ${v.channel} · <i>${v.topic}</i></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    },

    /* ============================================================
       VIEW 6: TEACHER'S RESOURCE & LESSON PLANS
       ============================================================ */
    renderLessonView(unit) {
      const lp = unit.lessonPlan || {};
      const daily = lp.dailyPlan || [];
      const physicalGames = [
        {
          name: 'Sinek Raketi (Flyswatter Word Slam)',
          type: 'Hızlı Refleks & Kelime',
          rules: 'Tahtaya bu ünitenin kelime kartları yapıştırılır. İki takımdan birer öğrenciye renkli sinek raketi verilir. Öğretmen kelimenin Türkçe anlamını söyler, İngilizce kartına ilk vuran takım puan alır!'
        },
        {
          name: 'Sihirli Çanta (Magic Bag TPR)',
          type: 'Dokun & Tahmin Et',
          rules: 'Çantanın içine üniteyle ilgili nesneler konur. Öğrenci gözü kapalı nesneyi tutar: "It is a pencil!" veya "It is an apple!" der. Doğru tahmin eden sınıfça alkışlanır.'
        },
        {
          name: 'Dört Köşe (Four Corners)',
          type: 'Kinestetik / Hareketli',
          rules: 'Sınıfın 4 köşesine 4 ana kelime resmi asılır. Öğretmen bir tanımı veya fonetik sesi okur ("It has the /æ/ sound"). Öğrenciler doğru köşeye koşarlar.'
        },
        {
          name: 'İnsan Düğümü (Human Sentence Knot)',
          type: 'İşbirlikli Cümle Kurma',
          rules: 'Her öğrenciye bir kelime kartı verilir. Takım üyeleri el ele tutuşarak Cambridge dilbilgisi kuralına uygun doğru sırayla dizilmeye çalışır.'
        }
      ];

      return `
        <div class="cam-lesson-section">
          <div class="cam-section-banner">
            <div>
              <h2>📋 Öğretmen Etkinlik Kılavuzu & Ders Planı</h2>
              <p>Cambridge Global English Stage ${this.stage} — Unit ${unit.number}: <b>${unit.title}</b></p>
            </div>
            <button class="cam-btn-print" onclick="window.print()">🖨️ Bu Planı Yazdır / PDF</button>
          </div>

          <div class="cam-goal-box">
            <h3>🎯 Haftalık Öğrenme Hedefi (Weekly Goal)</h3>
            <p>${lp.weeklyGoal || 'Öğrenciler ünite kelimelerini tam telaffuz ile öğrenir ve akıllı tahta oyunlarında aktif iletişim kurarlar.'}</p>
          </div>

          <!-- DAILY STRUCTURED BREAKDOWN -->
          <div class="cam-daily-plans">
            ${daily.map(d => `
              <div class="cam-day-card">
                <div class="cam-day-title">${d.day} — ${d.focus}</div>
                <div class="cam-day-steps">
                  <div class="cam-step"><span class="step-num">1</span> <b>Isınma (Warm-Up):</b> ${d.warmUp}</div>
                  <div class="cam-step"><span class="step-num">2</span> <b>Sunum (Presentation):</b> ${d.presentation}</div>
                  <div class="cam-step"><span class="step-num">3</span> <b>Alıştırma (Practice):</b> ${d.practice}</div>
                  <div class="cam-step"><span class="step-num">4</span> <b>Üretim (Production):</b> ${d.production}</div>
                  <div class="cam-step"><span class="step-num">5</span> <b>Kapanış (Wrap-Up):</b> ${d.wrapUp}</div>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- PHYSICAL CLASSROOM GAMES -->
          <div class="cam-physical-games">
            <h3>🏃‍♂️ Sınıf İçi Fiziksel Oyunlar & Smartboard Entegrasyonu</h3>
            <div class="cam-pgames-grid">
              ${physicalGames.map(g => `
                <div class="cam-pgame-card">
                  <div class="cam-pg-badge">${g.type}</div>
                  <h4 class="cam-pg-name">🎮 ${g.name}</h4>
                  <p class="cam-pg-rules">${g.rules}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    },

    /* ============================================================
       EVENT BINDING & INTERACTIONS
       ============================================================ */
    bindEvents() {
      if (!this.container) return;

      // 1. Stage selection
      this.container.querySelectorAll('.cam-stage-tab').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const st = e.currentTarget.getAttribute('data-stage');
          this.setStage(st);
        });
      });

      // 2. Unit selection
      const unitSelect = this.container.querySelector('#cam-unit-select');
      if (unitSelect) {
        unitSelect.addEventListener('change', (e) => {
          this.setUnit(e.target.value);
        });
      }

      // 3. Subnav tab navigation
      this.container.querySelectorAll('.cam-nav-tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
          const t = e.currentTarget.getAttribute('data-tab');
          this.setTab(t);
        });
      });

      // 4. Media toggle
      const mediaToggle = this.container.querySelector('#cam-toggle-media');
      if (mediaToggle) {
        mediaToggle.addEventListener('click', () => this.toggleMediaMode());
      }

      // 5. Music toggle
      const musicToggle = this.container.querySelector('#cam-toggle-music');
      if (musicToggle) {
        musicToggle.addEventListener('click', () => {
          BackgroundMusicPlayer.toggle();
          this.render();
        });
      }

      const songsBgMusic = this.container.querySelector('#cam-songs-bg-music');
      if (songsBgMusic) {
        songsBgMusic.addEventListener('click', () => {
          BackgroundMusicPlayer.toggle();
          this.render();
        });
      }

      // 6. Back home
      const backHome = this.container.querySelector('#cam-btn-back-home');
      if (backHome) {
        backHome.addEventListener('click', () => {
          SoundFX.playClick();
          BackgroundMusicPlayer.stop();
          if (typeof APP !== 'undefined' && APP.go) {
            APP.go('home');
          } else {
            window.location.reload();
          }
        });
      }

      // 7. Vocab Speech
      this.container.querySelectorAll('.cam-speak-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const word = e.currentTarget.getAttribute('data-word');
          const charKey = e.currentTarget.getAttribute('data-char') || 'polly';
          SoundFX.playClick();
          NaturalVoiceEngine.speak(word, charKey);
        });
      });

      this.container.querySelectorAll('.cam-quote-speak-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const text = e.currentTarget.getAttribute('data-text');
          const charKey = e.currentTarget.getAttribute('data-char') || 'polly';
          SoundFX.playClick();
          NaturalVoiceEngine.speak(text, charKey);
        });
      });

      // 8. Baamboozle controls
      this.container.querySelectorAll('.cam-team-btn[data-tcount]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          this.setTeamsCount(e.currentTarget.getAttribute('data-tcount'));
        });
      });

      const baamReset = this.container.querySelector('#cam-baam-reset');
      if (baamReset) {
        baamReset.addEventListener('click', () => {
          SoundFX.playClick();
          this.resetBaamboozle();
          this.render();
        });
      }

      const baamAgain = this.container.querySelector('#cam-baam-play-again');
      if (baamAgain) {
        baamAgain.addEventListener('click', () => {
          SoundFX.playClick();
          this.resetBaamboozle();
          this.render();
        });
      }

      // 9. Open tile modal
      this.container.querySelectorAll('.cam-tile.openable').forEach(tileBtn => {
        tileBtn.addEventListener('click', (e) => {
          const idx = parseInt(e.currentTarget.getAttribute('data-tileidx'), 10);
          this.openTileModal(idx);
        });
      });

      // 10. Modal controls
      const btnShowAns = this.container.querySelector('#cam-btn-show-ans');
      if (btnShowAns) {
        btnShowAns.addEventListener('click', () => {
          SoundFX.playClick();
          if (this.baam.activeModal) {
            this.baam.activeModal.showAnswer = true;
            this.render();
          }
        });
      }

      const btnAwardCorrect = this.container.querySelector('#cam-btn-award-correct');
      if (btnAwardCorrect) {
        btnAwardCorrect.addEventListener('click', () => {
          this.resolveTileAction('correct');
        });
      }

      const btnAwardWrong = this.container.querySelector('#cam-btn-award-wrong');
      if (btnAwardWrong) {
        btnAwardWrong.addEventListener('click', () => {
          this.resolveTileAction('wrong');
        });
      }

      const btnAwardMystery = this.container.querySelector('#cam-btn-award-mystery');
      if (btnAwardMystery) {
        btnAwardMystery.addEventListener('click', () => {
          this.resolveTileAction('mystery');
        });
      }

      const btnDoSteal = this.container.querySelector('#cam-btn-do-steal');
      if (btnDoSteal) {
        btnDoSteal.addEventListener('click', () => {
          this.resolveTileAction('steal');
        });
      }

      const btnDoSwap = this.container.querySelector('#cam-btn-do-swap');
      if (btnDoSwap) {
        btnDoSwap.addEventListener('click', () => {
          this.resolveTileAction('swap');
        });
      }

      const btnCloseModal = this.container.querySelector('#cam-btn-close-modal');
      if (btnCloseModal) {
        btnCloseModal.addEventListener('click', () => {
          SoundFX.playClick();
          this.baam.activeModal = null;
          this.render();
        });
      }

      // 11. Tongue Twister speeds & search
      this.container.querySelectorAll('.cam-sp-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          SoundFX.playClick();
          this.twisterSpeed = parseFloat(e.currentTarget.getAttribute('data-speed')) || 1.0;
          this.render();
        });
      });

      const twSearch = this.container.querySelector('#cam-twister-search');
      if (twSearch) {
        // PERF: Debounced search input
        twSearch.addEventListener('input', (e) => {
          this.twisterFilter = e.target.value;
          // rerender on next tick or fast filter
          this.render();
          const inputAgain = this.container.querySelector('#cam-twister-search');
          if (inputAgain) {
            inputAgain.focus();
            inputAgain.setSelectionRange(inputAgain.value.length, inputAgain.value.length);
          }
        });
      }

      this.container.querySelectorAll('.cam-btn-speak-twister').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const text = e.currentTarget.getAttribute('data-text');
          SoundFX.playClick();
          NaturalVoiceEngine.speak(text, 'polly', this.twisterSpeed);
        });
      });

      // 12. Sing along karaoke
      this.container.querySelectorAll('.cam-btn-sing-along').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const raw = decodeURIComponent(e.currentTarget.getAttribute('data-lyrics') || '');
          SoundFX.playWinChime();
          NaturalVoiceEngine.speak(raw, 'polly', 0.95);
        });
      });

      // 13. Video filters
      this.container.querySelectorAll('.cam-vf-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          SoundFX.playClick();
          this.videoFilter = e.currentTarget.getAttribute('data-vfilter');
          this.render();
        });
      });
    },

    openTileModal(tileIdx) {
      const tile = this.baam.tiles[tileIdx];
      if (!tile || tile.done) return;
      SoundFX.playClick();
      this.baam.activeModal = {
        idx: tileIdx,
        tile: tile,
        showAnswer: false
      };
      this.render();
    },

    resolveTileAction(actionType) {
      const modal = this.baam.activeModal;
      if (!modal) return;
      const tile = modal.tile;
      const pts = tile.question.pts || 15;
      const currentTeam = this.baam.turn % this.baam.teamsCount;

      if (actionType === 'correct') {
        this.baam.teamScores[currentTeam] += pts;
        SoundFX.playWinChime();
        ConfettiEngine.blast();
        NaturalVoiceEngine.speakPraise();
      } else if (actionType === 'wrong') {
        SoundFX.playLossBuzz();
      } else if (actionType === 'mystery') {
        this.baam.teamScores[currentTeam] = Math.max(0, this.baam.teamScores[currentTeam] + pts);
        if (pts >= 0) {
          SoundFX.playBonus();
          ConfettiEngine.blast();
        } else {
          SoundFX.playPenalty();
        }
      } else if (actionType === 'steal') {
        // Steal from leading other team
        let targetTeam = (currentTeam + 1) % this.baam.teamsCount;
        for (let i = 0; i < this.baam.teamsCount; i++) {
          if (i !== currentTeam && this.baam.teamScores[i] > this.baam.teamScores[targetTeam]) {
            targetTeam = i;
          }
        }
        const stolen = Math.min(pts, this.baam.teamScores[targetTeam]);
        this.baam.teamScores[targetTeam] = Math.max(0, this.baam.teamScores[targetTeam] - stolen);
        this.baam.teamScores[currentTeam] += stolen;
        SoundFX.playSteal();
        ConfettiEngine.blast();
      } else if (actionType === 'swap') {
        // Swap with leading team
        let maxTeam = (currentTeam + 1) % this.baam.teamsCount;
        for (let i = 0; i < this.baam.teamsCount; i++) {
          if (i !== currentTeam && this.baam.teamScores[i] > this.baam.teamScores[maxTeam]) {
            maxTeam = i;
          }
        }
        const temp = this.baam.teamScores[currentTeam];
        this.baam.teamScores[currentTeam] = this.baam.teamScores[maxTeam];
        this.baam.teamScores[maxTeam] = temp;
        SoundFX.playSwap();
        ConfettiEngine.blast();
      }

      // Mark tile done
      tile.done = true;
      this.baam.turn++;
      this.baam.activeModal = null;
      this.render();
    },

    destroy() {
      clearAllTimers();
      ConfettiEngine.destroy();
      BackgroundMusicPlayer.stop();
      if (typeof window !== 'undefined' && window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
    }
  };

  // Expose globally
  if (typeof window !== 'undefined') {
    window.ConfettiEngine = ConfettiEngine;
    window.SoundFX = SoundFX;
    window.BackgroundMusicPlayer = BackgroundMusicPlayer;
    window.NaturalVoiceEngine = NaturalVoiceEngine;
    window.CAMBRIDGE_PLATFORM = CAMBRIDGE_ENGINE;
    window.CAMBRIDGE_ENGINE = CAMBRIDGE_ENGINE;
  }
})();

/* ============================================================
   🛡️ ANTIVIRUS & SİBER GÜVENLİK KALKANI — Polly Shield Pro
   XSS, Rogue Iframe, Zararlı Kod Enjeksiyonu ve Veri Bütünlüğü Koruması
   ============================================================ */
const ANTIVIRUS = {
  initialized: false,
  quarantineLog: [],
  maxLogEntries: 20, // // PERF: Sınırlı bellek havuzu
  lastScanTime: null,
  observer: null,
  allowedIframeOrigins: [
    'https://www.youtube-nocookie.com',
    'https://www.youtube.com'
  ],

  init() {
    if (this.initialized || typeof window === 'undefined' || typeof document === 'undefined') return;
    this.initialized = true;
    this.lastScanTime = new Date().toLocaleTimeString();

    // 1. Canlı DOM İzleyici (MutationObserver)
    try {
      if (typeof MutationObserver !== 'undefined' && document.body) {
        this.observer = new MutationObserver((mutations) => {
          for (let m of mutations) {
            if (m.addedNodes) {
              for (let i = 0; i < m.addedNodes.length; i++) {
                const node = m.addedNodes[i];
                if (node && node.nodeType === 1) {
                  this.inspectElement(node);
                }
              }
            }
          }
        });
        this.observer.observe(document.body, { childList: true, subtree: true });
      }
    } catch (e) {
      // sessizce geç
    }

    // 2. İlk link ve öğe güvenlik taraması
    this.guardLinks();
  },

  inspectElement(el) {
    if (!el || !el.tagName) return;
    const tag = el.tagName.toUpperCase();

    // Yetkisiz dinamik script enjeksiyonunu engelle
    if (tag === 'SCRIPT') {
      const src = (el.getAttribute('src') || '').trim();
      const isLocal = !src || src.startsWith('/') || src.startsWith('./') || (typeof window !== 'undefined' && window.location && src.includes(window.location.hostname));
      if (!isLocal) {
        this.quarantine(el, 'Yetkisiz Dış Script Enjeksiyonu Engellendi (' + src.slice(0, 35) + ')');
        return;
      }
    }

    // Yetkisiz iframe'leri engelle
    if (tag === 'IFRAME') {
      const src = (el.getAttribute('src') || '').trim();
      const isAllowed = this.allowedIframeOrigins.some(origin => src.startsWith(origin)) || src === 'about:blank' || !src;
      if (!isAllowed) {
        this.quarantine(el, 'Yetkisiz Iframe Kaynağı Engellendi (' + src.slice(0, 35) + ')');
        return;
      }
    }

    // Çocuk iframe'leri tara
    if (el.querySelectorAll) {
      try {
        const frames = el.querySelectorAll('iframe');
        frames.forEach(f => {
          const src = (f.getAttribute('src') || '').trim();
          const isAllowed = this.allowedIframeOrigins.some(origin => src.startsWith(origin)) || src === 'about:blank' || !src;
          if (!isAllowed) this.quarantine(f, 'Yetkisiz Gömülü Iframe');
        });
      } catch (err) {}
    }

    // Tehlikeli javascript: linklerini etkisizleştir
    if (tag === 'A') {
      const href = (el.getAttribute('href') || '').toLowerCase();
      if (href.startsWith('javascript:')) {
        el.setAttribute('href', '#');
        this.logEvent('Tehlikeli Javascript: Linki Nötralize Edildi', 'warning');
      }
      if (el.target === '_blank' && (!el.rel || !el.rel.includes('noopener'))) {
        el.rel = 'noopener noreferrer';
      }
    }
  },

  quarantine(el, reason) {
    try {
      if (el && el.parentNode) {
        el.parentNode.removeChild(el);
      }
    } catch (e) {}
    this.logEvent(reason, 'threat');
    if (typeof FX !== 'undefined' && FX.toast) {
      FX.toast('🛡️ Güvenlik Kalkanı: ' + reason);
    }
  },

  logEvent(msg, type = 'info') {
    const entry = {
      time: new Date().toLocaleTimeString(),
      msg: String(msg || ''),
      type: type
    };
    this.quarantineLog.unshift(entry);
    if (this.quarantineLog.length > this.maxLogEntries) {
      this.quarantineLog.pop();
    }
  },

  guardLinks() {
    try {
      if (typeof document === 'undefined') return;
      document.querySelectorAll('a[target="_blank"]').forEach(a => {
        a.rel = 'noopener noreferrer';
      });
      document.querySelectorAll('a[href^="javascript:"]').forEach(a => {
        a.setAttribute('href', '#');
      });
    } catch (e) {}
  },

  runDeepScan() {
    this.lastScanTime = new Date().toLocaleTimeString();
    const results = [];

    // 1. Script Güvenliği & XSS Kalkanı
    let scriptsSafe = true;
    let foreignScripts = 0;
    if (typeof document !== 'undefined') {
      const scripts = document.querySelectorAll('script');
      scripts.forEach(s => {
        const src = s.getAttribute('src') || '';
        if (src.startsWith('http') && typeof window !== 'undefined' && window.location && !src.includes(window.location.hostname)) {
          foreignScripts++;
          scriptsSafe = false;
        }
      });
    }
    results.push({
      id: 'scripts',
      title: 'Script Bütünlüğü & XSS Kalkanı',
      status: scriptsSafe ? 'pass' : 'warn',
      desc: scriptsSafe ? 'Tüm scriptler yerel paketle mühürlü. Yetkisiz enjeksiyon yok.' : foreignScripts + ' harici script tespit edildi.'
    });

    // 2. Iframe ve Medya Güvenliği
    let iframesSafe = true;
    let rogueFrames = 0;
    if (typeof document !== 'undefined') {
      const frames = document.querySelectorAll('iframe');
      frames.forEach(f => {
        const src = f.getAttribute('src') || '';
        const ok = this.allowedIframeOrigins.some(origin => src.startsWith(origin)) || src === 'about:blank' || !src;
        if (!ok) {
          rogueFrames++;
          iframesSafe = false;
        }
      });
    }
    results.push({
      id: 'iframes',
      title: 'Iframe & Gömülü Medya Güvenliği',
      status: iframesSafe ? 'pass' : 'threat',
      desc: iframesSafe ? 'Tüm video çerçeveleri YouTube Nocookie ve CSP sandbox ile korumalı.' : rogueFrames + ' şüpheli iframe bulundu.'
    });

    // 3. LocalStorage & Depolama Bütünlüğü
    let storageSafe = true;
    let storageSize = 0;
    try {
      if (typeof localStorage !== 'undefined') {
        for (let k in localStorage) {
          if (Object.prototype.hasOwnProperty.call(localStorage, k)) {
            storageSize += (localStorage[k] || '').length;
          }
        }
        if (storageSize > 2000000) storageSafe = false;
      }
    } catch (e) {
      storageSafe = true; // Korumalı ortam güvenli kabul edilir
    }
    results.push({
      id: 'storage',
      title: 'Bellek & Depolama Manipülasyon Koruması',
      status: storageSafe ? 'pass' : 'warn',
      desc: storageSafe ? 'Tarayıcı hafızası temiz. Kota ve zararlı veri sızıntısı yok (~' + Math.round(storageSize / 1024) + ' KB).' : 'Depolama sınırında anormallik.'
    });

    // 4. Prototype Pollution Kontrolü
    let protoSafe = true;
    try {
      const probe = {};
      if (probe.polluted || Object.prototype.polluted) {
        protoSafe = false;
      }
    } catch (e) {
      protoSafe = false;
    }
    results.push({
      id: 'proto',
      title: 'Prototype Pollution & Nesne Koruması',
      status: protoSafe ? 'pass' : 'threat',
      desc: protoSafe ? 'Object.prototype kilitli ve temiz. Bellek enjeksiyonu engellendi.' : 'Prototype kirlenmesi riski algılandı.'
    });

    // 5. İçerik ve Bağlantı Güvenliği
    results.push({
      id: 'links',
      title: 'Ters Yönlendirme (Reverse Tabnabbing) Koruması',
      status: 'pass',
      desc: 'Tüm dış bağlantılar "noopener noreferrer" bayrağıyla izole edilmiştir.'
    });

    // 6. Sıfır-Çökme & Hata Yakalama Kalkanı
    results.push({
      id: 'shield',
      title: 'Sıfır-Çökme (P0 Anti-Crash) Kalkanı',
      status: (typeof window !== 'undefined' && window.__SHIELD) ? 'pass' : 'warn',
      desc: 'Global hata yakalayıcı ve otomatik kurtarma mekanizması devrede.'
    });

    return results;
  },

    if (typeof CAMBRIDGE_ENGINE !== 'undefined' && CAMBRIDGE_ENGINE.destroy) {

  saveState() {

        stage: this.stage,
        unitId: this.unitId,
        engineId: this.engineId,
        lvIdx: this.lvIdx,
        lesIdx: this.lesIdx,
        score: this.currentScore || 0,
        timestamp: Date.now()
      };
      store.set('last_state', snap);
      store.saveCheckpoint(snap);
    } catch (e) {}
  },

  restoreLastState() {
    const s = store.getCheckpoint() || store.get('last_state');
    if (s && s.scr && s.scr !== 'home') {
      this.go(s.scr, {
        stage: s.stage,
        unitId: s.unitId,
        engineId: s.engineId,
        lvIdx: s.lvIdx || 0,
        lesIdx: s.lesIdx || 0,
        restoredScore: s.score || 0
      });

  countGames() {

  /* ---------- Seviye Seçme Modalı ---------- */
  pickLevel(eid) {
    const e = ENGINES.find((x) => x.id === eid);
    if (!e) return;
    const ov = el(`<div class="overlay"><div class="modal">
     <h3>${e.e} ${e.t}</h3><div class="muted" style="margin-bottom:10px">${e.d}</div>
     <div class="lvl-row" style="justify-content:center">${e.levels
       .map(
         (l, i) =>
           `<button class="lvl-pill" data-l="${i}">${'🟢🟡🔴'[i] || '🎯'} ${l.n}</button>`
       )
       .join('')}</div></div></div>`);
    document.body.appendChild(ov);
    ov.addEventListener('click', (ev) => {
      if (ev.target === ov) ov.remove();
      const b = ev.target.closest('[data-l]');
      if (b) {
        ov.remove();
        MEDIA.fx('whoosh');
        this.go('game', { engineId: eid, unitId: this.unitId, lvIdx: +b.dataset.l });
      }
    });
  },

  /* ---------- Oyunu Başlat ---------- */
  mountGame() {
    const area = document.getElementById('garea');
    if (!area) return;
    const u = unitById(this.unitId),
      e = ENGINES.find((x) => x.id === this.engineId);
    if (!u || !e) return;
    const self = this;
    let score = this.restoredScore || 0;
    this.currentScore = score;

    const upd = () => {
      const s = document.getElementById('gsc');
      if (s) {
        s.textContent = score;
        s.classList.remove('bump');
        void s.offsetWidth;
        s.classList.add('bump');
      }
    };

    let isDestroyed = false;
    self.cleanups.push(() => {
      isDestroyed = true;
    });

    const api = {
      root: area,
      unit: u,
      lv: e.levels[this.lvIdx] ? e.levels[this.lvIdx].c : {},
      score: score,
      isDestroyed: () => isDestroyed,
      add(n) {
        if (isDestroyed) return;
        score += n;
        self.currentScore = score;
        this.score = score;
        upd();
        store.saveCheckpoint({
          scr: 'game',
          stage: self.stage,
          unitId: u.id,
          engineId: e.id,
          lvIdx: self.lvIdx,
          score: score
        });
        if (score > 0 && score % 60 === 0) {
          const p = pick(PRAISE);
          FX.mascotSay(p + ' 🦜');
          MEDIA.speak(p);
          FX.confetti(30);
          MEDIA.fx('cheer');
        }
      },
      progress(c, t) {
        if (isDestroyed) return;
        const p = Math.min(100, Math.round((c / t) * 100));
        const b = document.getElementById('gtbi');
        if (b) b.style.width = p + '%';
        const pc = document.getElementById('gpc');
        if (pc) pc.textContent = p + '%';
      },
      info(html) {
        if (isDestroyed) return null;
        const i = document.getElementById('ginfo');
        if (i) {
          i.innerHTML = html;
          return i.firstElementChild || i;
        }
        return null;
      },
      speak: (t, r, cb) => !isDestroyed && MEDIA.speak(t, r, cb),
      fx: (n) => !isDestroyed && MEDIA.fx(n),
      cleanup(f) {
        self.cleanups.push(f);
      },
      restart() {
        self.go('game', {
          engineId: self.engineId,
          unitId: self.unitId,
          lvIdx: self.lvIdx
        });
      },
      end(res) {
        if (isDestroyed) return;
        isDestroyed = true;
        self.cleanup();
        MEDIA.stopSpeak();
        const pct = res.max ? res.score / res.max : 1;
        const st = pct >= 0.85 ? 3 : pct >= 0.55 ? 2 : 1;
        const key = e.id + '|' + u.id + '|' + self.lvIdx,
          b = store.get('best') || {};
        if (!b[key] || b[key].s < res.score) {
          b[key] = { s: res.score, st: Math.max(st, b[key] ? b[key].st : 0) };
          store.set('best', b);
        } else if (b[key].st < st) {
          b[key].st = st;
          store.set('best', b);
        }
        FX.confetti(60);
        MEDIA.fx('win');
        area.innerHTML = `<div class="center" style="padding:24px 16px">
         <div style="font-size:52px;margin-bottom:8px">🎉 🏆 🎉</div>
         <div class="pw" style="font-size:1.6em;color:var(--c-primary);font-weight:900">Harika İş Çıkardın!</div>
         <div class="muted" style="margin-top:6px;font-size:1em">${res.note || 'Tebrikler! Bu aktiviteyi başarıyla tamamladın.'}</div>
         <div class="row" style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">
           <button class="btn green" id="rag">🔁 Tekrar Oyna</button>
           <button class="btn gold" id="rbaam">🧩 Baamboozle Takım Oyunu</button>
           <button class="btn blue" id="run">➡️ Ünite Menüsü</button>
         </div></div>`;
        const rag = area.querySelector('#rag');
        if (rag) rag.onclick = () => api.restart();
        const rbaam = area.querySelector('#rbaam');
        if (rbaam) rbaam.onclick = () => self.go('game', { engineId: 'baamboozle', unitId: u.id, lvIdx: 0 });
        const run = area.querySelector('#run');
        if (run) run.onclick = () => self.go('unit', { unitId: u.id });
      }
    };

    upd();
    try {
      e.init(api);
    } catch (err) {
      // // SAFETY: Motor hata verse dahi beyaz ekran olmasını engelle, puanı koru ve kurtar
      console.error(`[EngineIsolation] Error in engine ${e.id}:`, err);
      store.saveCheckpoint({
        scr: 'game',
        stage: self.stage,
        unitId: u.id,
        engineId: e.id,
        lvIdx: self.lvIdx,
        score: score,
        error: String(err && err.message)
      });
      area.innerHTML = `<div class="center" style="padding:22px;background:#fff;border-radius:22px;border:3px dashed #f59e0b;margin:16px auto;max-width:480px">
        <div class="big-emoji" style="font-size:54px">🦜</div>
        <h3 style="margin:8px 0;color:#0f172a">Polly bir aksilik yakaladı ve çözdü!</h3>
        <p style="color:#64748b;margin-bottom:14px">Toplanan puanın (${score} ⭐) hafızada güvende.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn green" id="rec-restart">🔄 Yeniden Başlat</button>
          <button class="btn white" id="rec-unit">📚 Üniteye Dön</button>
        </div>
      </div>`;
      const rb = area.querySelector('#rec-restart'),
        ub = area.querySelector('#rec-unit');
      if (rb) rb.onclick = () => api.restart();
      if (ub) ub.onclick = () => self.go('unit', { unitId: u.id });
    }
  },

  /* ---------- Şarkı & Tekerleme Oynatıcı (Müzikle Uyumlu Söyleyiş) ---------- */
  mountPlayer() {
    const s = this.playing;
    if (!s) return;
    let idx = 0,
      slow = false,
      running = false,
      timer = null;
    const lines = [...document.querySelectorAll('#ly .line')];
    const mel = typeof melodyFor === 'function' ? melodyFor(s) : null;
    const bt = 'beat' + ([...(s.t || 'x')].reduce((a, c) => a + c.codePointAt(0), 0) % (typeof BEATN !== 'undefined' ? BEATN : 6));
    let mus = null,
      music = true;
    const musStop = () => {
      if (mus) {
        MEDIA.stopMusic(mus);
        mus = null;
      }
    };
    const musStart = () => {
      musStop();
      if (!music) return;
      if (mel) {
        mus = MEDIA.playFile(mel, 0.85, true) || MEDIA.playFile(bt, 0.5, true);
      } else {
        mus = MEDIA.playFile(bt, 0.5, true);
      }
    };
    const stop = () => {
      running = false;
      clearTimeout(timer);
      MEDIA.stopSpeak();
      musStop();
      lines.forEach((l) => l.classList.remove('active'));
    };
    this.cleanups.push(stop);

    const step = () => {
      if (!running) return;
      if (idx >= lines.length) {
        stop();
        FX.confetti(50);
        MEDIA.fx('win');
        FX.mascotSay('Bravo! 🎉 Harika söylediniz! / Sing again?');
        return;
      }
      lines.forEach((l) => l.classList.remove('active'));
      const ln = lines[idx];
      if (ln) {
        ln.classList.add('active');
        if (ln.scrollIntoView) {
          try {
            ln.scrollIntoView({ block: 'center', behavior: 'smooth' });
          } catch (e) {}
        }
        FX.notes(innerWidth / 2, innerHeight - 160);
        MEDIA.fx('pop');
        // Ritmik tempo: melodi kesilmeden çalar, çocuklar ve sınıf resimleri takip ederek birlikte söyler
        const lineDur = slow ? 4200 : 2900;
        timer = setTimeout(() => {
          idx++;
          step();
        }, lineDur);
      }
    };

    // Tıklanan satırı vurgulama ve neşeli efekt
    lines.forEach((l) => {
      l.addEventListener('click', () => {
        lines.forEach((x) => x.classList.remove('active'));
        l.classList.add('active');
        MEDIA.fx('pop');
        FX.confetti(12);
        FX.notes(innerWidth / 2, innerHeight - 140);
      });
    });

    const pp = document.getElementById('pp');
    if (pp) {
      pp.onclick = () => {
        MEDIA.fx('click');
        running = true;
        idx = 0;
        musStart();
        step();
      };
    }
    const pr = document.getElementById('pr');
    if (pr) {
      pr.onclick = () => {
        MEDIA.fx('click');
        stop();
        running = true;
        idx = 0;
        setTimeout(() => {
          musStart();
          step();
        }, 150);
      };
    }
    const ps = document.getElementById('ps');
    if (ps) {
      ps.onclick = (e) => {
        slow = !slow;
        e.target.textContent = slow ? '🐇 Normal Ritim' : '🐢 Yavaş Ritim';
        MEDIA.fx('click');
      };
    }
    const pm = document.getElementById('pm');
    if (pm) {
      pm.onclick = (e) => {
        music = !music;
        e.target.textContent = music ? '🎵 Müzik: Açık' : '🎵 Müzik: Kapalı';
        MEDIA.fx('click');
        if (music && running) musStart();
        else musStop();
      };
    }
    const pa = document.getElementById('pa');
    if (pa) {
      pa.onclick = () => {
        MEDIA.fx('click');
        stop();
      };
    }
  },

  mountLesson() {
    const u = unitById(this.unitId);
    if (!u || !LESSONS[u.id]) return;
    const L = LESSONS[u.id],
      total = L.length + 4,
      n = this.lesIdx || 0;
    // // SAFETY: Ders slayt durumu hafızaya kaydedilir (çökme/yenileme kurtarma)
    store.saveCheckpoint({
      scr: 'lesson',
      stage: this.stage,
      unitId: u.id,
      lesIdx: n,
      timestamp: Date.now()
    });
    if (n === 0) MEDIA.speak("Ready? Let's begin!");
    if (n === L.length) MEDIA.speak('Our new words!');
    if (n === L.length + 1) MEDIA.speak('Show me!');
    if (n === L.length + 2) MEDIA.speak('Watch the video!');
    if (n === L.length + 3) {
      MEDIA.speak('Well done! You completed the lesson!');
      FX.confetti(70);
      MEDIA.fx('win');
    }
    const say = (t, r) => MEDIA.speak(t, r || 0.88);
    const prev = document.getElementById('lprev'),
      next = document.getElementById('lnext');
    if (prev)
      prev.onclick = () => {
        MEDIA.fx('click');
        this.lesIdx = Math.max(0, n - 1);
        this.render();
      };
    if (next)
      next.onclick = () => {
        MEDIA.fx('pop');
        if (n >= total - 1) this.go('unit', { unitId: u.id });
        else {
          this.lesIdx = n + 1;
          this.render();
        }
      };
    if (n < L.length) {
      const s = L[n];
      const b1 = document.getElementById('lL'),
        b2 = document.getElementById('lS'),
        b3 = document.getElementById('lR');
      if (b1)
        b1.onclick = () => {
          MEDIA.fx('click');
          say(s[1]);
        };
      if (b2)
        b2.onclick = () => {
          MEDIA.fx('click');
          say(s[1], 0.78);
        };
      if (b3)
        b3.onclick = () => {
          MEDIA.fx('magic');
          MEDIA.speak('Listen and repeat!', 0.92, () => say(s[1]));
        };
      document.querySelectorAll('.ldrill [data-d]').forEach(
        (b) =>
          (b.onclick = () => {
            const d = b.dataset.d;
            MEDIA.fx('click');
            const drillPrompt = {
              tog: 'Together!',
              boys: 'Boys!',
              girls: 'Girls!',
              loud: 'Loud!',
              whis: 'Whisper!',
              clap: 'Clap!',
              once: 'One more time!'
            }[d];
            const after = () => {
              if (d === 'loud') MEDIA.speak(s[1], 0.95, null, 1);
              else if (d === 'whis') MEDIA.speak(s[1], 0.82, null, 0.4);
              else if (d === 'clap') {
                FX.confetti(14);
                MEDIA.speak(s[1], 0.88);
              } else say(s[1]);
            };
            if (drillPrompt) {
              MEDIA.speak(drillPrompt, 0.95, after);
            } else {
              after();
            }
          })
      );
    }
    if (n === L.length) {
      document.querySelectorAll('.lword').forEach(
        (b) =>
          (b.onclick = () => {
            const w = u.w[+b.dataset.i];
            MEDIA.fx('pop');
            b.classList.add('lit');
            setTimeout(() => b.classList.remove('lit'), 700);
            MEDIA.speak(w[0], 0.88);
            FX.notes(innerWidth / 2, innerHeight - 140);
          })
      );
    }
    if (n === L.length + 1) {
      /* 🎯 mini quiz */
      const qw = shuffle(u.w.filter((w) => w[1])).slice(0, 4);
      const box = document.getElementById('lquiz');
      if (box && qw.length) {
        let qi = 0;
        const drawQ = () => {
          if (qi >= qw.length) {
            box.innerHTML = `<div class="lqdone">🎉🌟🎉<div class="len" style="margin-top:8px">You know the words!</div><div class="ltr">Kelime şampiyonusunuz!</div></div>`;
            MEDIA.speak('Well done! You know the words!');
            FX.confetti(60);
            return;
          }
          const cur = qw[qi];
          const opts = shuffle([cur, ...sample(u.w.filter((w) => w[1] && w[0] !== cur[0]), 2)]);
          box.innerHTML = `<div class="lqq">Show me the <b>${esc(cur[0])}</b>!</div>
            <div class="lqopts">${opts.map((o) => `<button class="lqopt" data-ok="${o[0] === cur[0] ? 1 : 0}"><span>${o[1]}</span></button>`).join('')}</div>
            <div class="lqstars">${'⭐'.repeat(qi)}${'☆'.repeat(qw.length - qi)}</div>`;
          MEDIA.speak(cur[0], 0.88);
          box.querySelectorAll('.lqopt').forEach((ob) => (ob.onclick = () => {
            if (ob.dataset.ok === '1') {
              ob.classList.add('ok');
              MEDIA.fx('correct');
              FX.confetti(24);
              MEDIA.speak('Yes!');
              setTimeout(() => {
                qi++;
                drawQ();
              }, 1100);
            } else {
              ob.classList.add('no');
              FX.shake(ob);
              MEDIA.fx('wrong');
              MEDIA.speak('Try again!');
            }
          }));
        };
        drawQ();
      }
    }
    if (n === L.length + 2) {
      document.querySelectorAll('.video-pill-btn[data-lvid]').forEach((b) => {
        b.onclick = () => {
          document.querySelectorAll('.video-pill-btn[data-lvid]').forEach((x) => x.classList.remove('active'));
          b.classList.add('active');
          const vf = document.getElementById('les-video-frame');

          if (vf) vf.src = `https://www.youtube-nocookie.com/embed/${b.dataset.lvid}?rel=0`;
          if (vt) vt.textContent = b.dataset.ltit;
        };
      });
    }
    if (n === L.length + 3) {
      const p = document.getElementById('lP'),
        b = document.getElementById('lB');
      if (p)
        p.onclick = () => {
          MEDIA.fx('whoosh');
          MEDIA.speak('Bye bye!');
          setTimeout(() => this.go('unit', { unitId: u.id }), 500);
        };
      if (b)
        b.onclick = () => {
          MEDIA.fx('click');
          this.lesIdx = 0;
          this.render();
        };
    }
  },

/* ---------- ANTİ-CRASH SHIELD (Global Hata Yakalayıcı & Otomatik Kurtarma) ---------- */
function handleGlobalCrash(err, type = 'error') {
  // // SAFETY: P0 Asla Çökme Kuralı — global hataları yakala, hafızaya işle ve kurtarma UI göster
  console.error(`[Anti-Crash Shield] Intercepted ${type}:`, err);
  if (typeof store !== 'undefined' && store.pushHistory) {
    store.pushHistory({
      type: 'crash',
      error: String(err && err.message ? err.message : err),
      timestamp: Date.now()
    });
  }

  const banner = document.getElementById('crash-banner');
  if (!banner) return;
  banner.classList.add('show');

  const diag = document.getElementById('crash-diag');
  if (diag) {
    const hist = (typeof store !== 'undefined' && store.getHistory ? store.getHistory() : [])
      .slice(-5)
      .map((h) => `${new Date(h.timestamp).toLocaleTimeString()}: ${h.action || h.type || 'olay'}`)
      .join('\n');
    diag.textContent = `Hata Detayı: ${err && err.message ? err.message : err}\n\nYığın İzleme:\n${(err && err.stack) || 'Bilgi yok'}\n\nSon 5 İşlem Geçmişi:\n${hist || 'Kayıt yok'}`;
  }

  const toggleBtn = document.getElementById('crash-toggle-diag');
  if (toggleBtn && diag) {
    toggleBtn.onclick = () => {
      diag.classList.toggle('show');
    };
  }

  const resBtn = document.getElementById('crash-resume');
  if (resBtn) {
    resBtn.onclick = () => {
      banner.classList.remove('show');
      if (diag) diag.classList.remove('show');
      APP.restoreLastState();
    };
  }

  const hmBtn = document.getElementById('crash-home');
  if (hmBtn) {
    hmBtn.onclick = () => {
      banner.classList.remove('show');
      if (diag) diag.classList.remove('show');
      APP.go('home');
    };
  }
}

if (typeof window !== 'undefined') {
  window.addEventListener('error', (event) => {
    handleGlobalCrash(event.error || event.message, 'uncaught-error');
  });

  window.addEventListener('unhandledrejection', (event) => {
    handleGlobalCrash(event.reason, 'unhandled-rejection');
  });
}

    b.style.setProperty('--fly', window.innerWidth + 160 + 'px');
    L.appendChild(b);
    setTimeout(() => b.remove(), dur * 1000 + 500);
  }
}, 9000);

if (typeof window !== 'undefined') {
  window.APP = APP;
}

/* ---------- UYGULAMAYI BAŞLAT (Cross-OS & Safe Autoplay) ---------- */
if (typeof document !== 'undefined') {
  APP.floaties();
  APP.render();

  // // SAFETY: iOS Safari, Android Chrome ve Akıllı Tahtalarda ses ve sentezleyiciyi güvenle uyandır
  const warmAudio = () => {
    MEDIA.warmUp();
    MEDIA.init();
  };
  ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((evType) => {
    document.addEventListener(evType, warmAudio, { capture: true, passive: true, once: true });
  });

  if (typeof window !== 'undefined' && window.speechSynthesis) {
    try {
      const initVoices = () => {
        MEDIA.pickVoice();
      };
      speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    } catch (e) {}
  }
  FX.mascotSay('Merhaba! Ben Polly 🦜 Bir sınıf seç ve başlayalım!', 4500);
}

  </script>
</body>
</html>
