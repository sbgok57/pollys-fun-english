/* ============================================================
   🎨 POLLY'S FUN ENGLISH — CSS TASARIM SİSTEMİ (v2)
   Çocuk dostu, yüksek kontrastlı, akıllı tahta ve dokunmatik uyumlu
   ============================================================ */

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --accent: #f59e0b;
  --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fdf2f8 100%);
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;
  --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --shadow-float: 0 14px 28px rgba(0, 0, 0, 0.12);
  --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Comic Sans MS', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

button, .btn, .card, .unit-card, .word-pill, .lword, .lqopt, .opt, .match-card, .drag-pill {
  touch-action: manipulation;
}

body {
  font-family: var(--font-family);
  background: var(--bg-gradient);
  color: var(--text-main);
  min-height: 100vh;
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top, 0);
  padding-bottom: env(safe-area-inset-bottom, 0);
  padding-left: env(safe-area-inset-left, 0);
  padding-right: env(safe-area-inset-right, 0);
  overflow-x: hidden;
  position: relative;
  line-height: 1.4;
}

body.s1 {
  background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 50%, #e0f2fe 100%);
}

body.s2 {
  background: linear-gradient(135deg, #eff6ff 0%, #ede9fe 50%, #fdf2f8 100%);
}

#floaties {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

#floaties span {
  position: absolute;
  bottom: -60px;
  animation: floatUp linear infinite;
  opacity: 0.6;
  transform: translate3d(0, 0, 0);
  will-change: transform;
}

@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  90% { opacity: 0.7; }
  100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
}

#fxlayer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  overflow: hidden;
}

#app {
  position: relative;
  z-index: 10;
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 16px 40px;
}

/* ═══ TOPBAR ═══ */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  border: 2px solid #e2e8f0;
}

.brand {
  font-weight: 900;
  color: #1e1b4b;
  font-size: 1.15em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.spacer {
  flex: 1;
}

.badge {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-weight: 800;
  font-size: 0.88em;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.badge.gold { background: #fef3c7; color: #b45309; }
.badge.blue { background: #dbeafe; color: #1d4ed8; }
.badge.purple { background: #f3e8ff; color: #6b21a8; }
.badge.red { background: #fee2e2; color: #dc2626; }

/* ═══ BUTONLAR ═══ */
.btn {
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 900;
  border-radius: var(--radius-full);
  padding: 12px 22px;
  font-size: 1em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
  min-height: 44px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
.btn:hover { transform: translateY(-2px); }
.btn.small { padding: 6px 14px; font-size: 0.9em; min-height: 38px; }
.btn.white { background: #ffffff; color: #1e293b; border: 2px solid #cbd5e1; }
.btn.blue { background: #3b82f6; color: #ffffff; }
.btn.green { background: #10b981; color: #ffffff; }
.btn.purple { background: #8b5cf6; color: #ffffff; }
.btn.red { background: #ef4444; color: #ffffff; }

/* ═══ HERO & ANA SAYFA ═══ */
.hero {
  text-align: center;
  padding: 16px 10px 10px;
}
.mascot {
  font-size: clamp(64px, 12vw, 92px);
  cursor: pointer;
  display: inline-block;
  animation: mascotHop 3.5s infinite ease-in-out;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
}
@keyframes mascotHop {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  45% { transform: translateY(-14px) rotate(4deg); }
  55% { transform: translateY(-14px) rotate(-4deg); }
}
.tag {
  color: #4338ca;
  font-weight: 800;
  font-size: clamp(0.95em, 2vw, 1.2em);
  margin-top: 6px;
}

.stats-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin: 18px 0;
}
.stat {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 10px 18px;
  border: 2px solid #e2e8f0;
  font-size: 0.92em;
  font-weight: 800;
  color: #334155;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat b { color: #4f46e5; font-size: 1.15em; }

.stage-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
  margin-top: 18px;
}
.stage-card {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 24px;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  transition: transform 0.2s, box-shadow 0.2s;
  border: 4px solid transparent;
  position: relative;
  overflow: hidden;
}
.stage-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-float);
}
.stage-card.s1 { border-color: #86efac; background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%); }
.stage-card.s2 { border-color: #93c5fd; background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%); }
.stage-card.songs { border-color: #f472b6; background: linear-gradient(180deg, #fdf2f8 0%, #ffffff 100%); }
.sc-emoji { font-size: 46px; display: block; margin-bottom: 8px; }
.stage-card h2 { font-size: 1.45em; color: #0f172a; margin-bottom: 6px; font-weight: 900; }
.stage-card p { color: #64748b; font-size: 0.92em; font-weight: 700; }

.baam-featured-card {
  background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
  border: 4px solid #f59e0b;
  border-radius: var(--radius-lg);
  padding: 22px 26px;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  transition: transform 0.2s, box-shadow 0.2s;
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.baam-featured-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-float);
}
.baam-fc-main { display: flex; align-items: center; gap: 18px; }
.baam-fc-emoji { font-size: 52px; }
.baam-fc-text h2 { font-size: 1.4em; color: #b45309; margin: 0 0 4px 0; font-weight: 900; }
.baam-fc-text p { margin: 0; color: #92400e; font-size: 0.95em; font-weight: 700; }

.quick-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 22px;
}

/* ═══ ÜNİTE VE OYUN KARTLARI ═══ */
.unit-head {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #ffffff;
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border: 3px solid #e2e8f0;
  margin-bottom: 18px;
}
.unit-head .ue { font-size: 48px; }
.unit-head h2 { font-size: 1.4em; font-weight: 900; color: #1e1b4b; }
.unit-head .sub { color: #64748b; font-size: 0.92em; font-weight: 700; }

.unit-grid, .game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}
.card {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 18px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  border: 3px solid #f1f5f9;
  text-align: center;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  position: relative;
}
.card:hover {
  transform: translateY(-4px);
  border-color: #818cf8;
  box-shadow: var(--shadow-md);
}
.card .big { font-size: 44px; display: block; margin-bottom: 6px; }
.card h3 { font-size: 1.05em; font-weight: 900; color: #1e293b; margin-bottom: 4px; }
.card .sub { font-size: 0.84em; color: #64748b; font-weight: 700; }
.ribbon {
  position: absolute;
  top: 10px;
  right: -24px;
  background: #f59e0b;
  color: #ffffff;
  font-size: 0.65em;
  font-weight: 900;
  padding: 3px 26px;
  transform: rotate(45deg);
}

/* ═══ KELİME DUVARI ═══ */
.word-wall {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.word-pill {
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: var(--radius-full);
  padding: 6px 14px;
  font-size: 0.92em;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.15s, background 0.15s;
}
.word-pill:hover {
  background: #fef08a;
  transform: scale(1.06);
}
.word-pill.lit {
  background: #fef08a !important;
  border-color: #f59e0b !important;
  transform: scale(1.08) !important;
  box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
}

/* ═══ OYUN EKRANI ═══ */
.game-head {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #ffffff;
  padding: 10px 18px;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-sm);
  border: 2px solid #e2e8f0;
  margin-bottom: 12px;
}
.gscore { font-weight: 900; font-size: 1.05em; color: #1e293b; }
.timerbar {
  width: 100%;
  height: 10px;
  background: #e2e8f0;
  border-radius: 6px;
  overflow: hidden;
}
#gtbi {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #10b981, #3b82f6);
  transition: width 0.3s;
}

.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
}

.prompt-box {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  border: 3px solid #e0e7ff;
  box-shadow: var(--shadow-sm);
  margin-bottom: 18px;
  width: 100%;
  max-width: 600px;
}
.prompt-box .pe { font-size: 48px; display: block; margin-bottom: 6px; }
.prompt-box .pw { font-size: 1.45em; font-weight: 900; color: #1e1b4b; }

.opt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 640px;
}
.opt {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 16px 14px;
  border: 3px solid #cbd5e1;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  transition: transform 0.15s, border-color 0.15s;
  min-height: 80px;
}
.opt:hover { transform: translateY(-3px); border-color: #6366f1; }
.opt .oe { font-size: 34px; line-height: 1.1; }
.opt .ow { font-size: 1.05em; font-weight: 900; color: #1e293b; margin-top: 4px; }
.opt.ok { background: #dcfce7; border-color: #22c55e; color: #15803d; }
.opt.no { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
.opt.sel { border-color: #3b82f6; background: #eff6ff; }

.match-grid {
  display: flex;
  gap: 20px;
  width: 100%;
  max-width: 620px;
  justify-content: center;
}
.match-grid .col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ═══ ŞARKI & CHANT ═══ */
.song-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}
.song-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.song-item {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 14px;
  border: 2px solid #e2e8f0;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s;
}
.song-item:hover { transform: translateY(-3px); border-color: #ec4899; }
.song-item .se { font-size: 32px; display: block; margin-bottom: 4px; }
.song-item h4 { font-size: 1em; font-weight: 900; color: #1e293b; }
.song-item .tune { font-size: 0.82em; color: #64748b; font-weight: 700; }

.player {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-md);
  border: 3px solid #fbcfe8;
  max-width: 680px;
  margin: 0 auto;
  text-align: center;
}
.lyrics {
  background: #fafafa;
  border-radius: var(--radius-md);
  padding: 18px;
  margin: 18px 0;
  max-height: 260px;
  overflow-y: auto;
  border: 2px solid #e2e8f0;
}
.lyrics .line {
  padding: 8px 12px;
  font-size: 1.15em;
  font-weight: 800;
  color: #475569;
  border-radius: 8px;
  transition: background 0.2s, color 0.2s, transform 0.2s;
}
.lyrics .line.active {
  background: #fdf2f8;
  color: #db2777;
  transform: scale(1.04);
}
.player .controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

/* ═══ MODAL & OVERLAY ═══ */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}
.modal {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-float);
  border: 4px solid #818cf8;
  text-align: center;
}
.lvl-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.lvl-pill {
  padding: 10px 18px;
  border-radius: var(--radius-full);
  border: 2px solid #cbd5e1;
  background: #ffffff;
  font-weight: 800;
  font-size: 0.95em;
  cursor: pointer;
  transition: all 0.15s;
}
.lvl-pill:hover, .lvl-pill.active {
  background: #4f46e5;
  color: #ffffff;
  border-color: #4f46e5;
}

/* ═══ SKORLAR & SONUÇLAR ═══ */
.result-stars {
  font-size: 48px;
  margin-bottom: 8px;
  color: #f59e0b;
}
.score-table {
  width: 100%;
  border-collapse: collapse;
  background: #ffffff;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-top: 14px;
}
.score-table th, .score-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid #f1f5f9;
  font-size: 0.92em;
}
.score-table th { background: #f8fafc; font-weight: 900; color: #475569; }

/* ═══ DİNAMİK PARÇACIKLAR & ANİMASYONLAR ═══ */
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 16px;
  top: -20px;
  border-radius: 3px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

.pop-star {
  position: absolute;
  font-size: 24px;
  animation: starPop 0.75s ease-out forwards;
}
@keyframes starPop {
  0% { transform: scale(0.3) translateY(0); opacity: 1; }
  100% { transform: scale(1.4) translateY(-40px); opacity: 0; }
}

.shake-anim { animation: shake 0.45s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}

.fb-flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  animation: fbFade 0.3s forwards;
}
.fb-flash.ok { background: rgba(34, 197, 94, 0.25); }
.fb-flash.no { background: rgba(239, 68, 68, 0.25); }
@keyframes fbFade { to { opacity: 0; } }

.mascot-bubble {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #ffffff;
  border: 3px solid #f59e0b;
  border-radius: 20px;
  padding: 12px 22px;
  font-size: 1.1em;
  font-weight: 900;
  color: #1e1b4b;
  box-shadow: var(--shadow-float);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 150;
}
/* ═══ v8 BÖLÜM BAŞLIKLARI (Unit Bölümleme) ═══ */
.usec{text-align:center;font-size:1.3em;font-weight:900;margin:20px 0 10px;color:#1e293b;text-shadow:0 1px 0 #fff}
.usec small{font-size:.58em;color:#64748b;font-weight:700;margin-left:6px}
.usec .badge{font-size:.7em;vertical-align:middle;margin-left:6px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:9999px;font-weight:800;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:all .25s;z-index:160}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.app-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: #1e293b;
  color: #ffffff;
  padding: 10px 20px;
  border-radius: var(--radius-full);
  font-weight: 800;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s;
  z-index: 160;
}
.app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- v2 YENİ ANİMASYONLAR & OYUNLAR ---------- */
.ripple {
  position: fixed;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 4px solid #fde047;
  background: rgba(253, 224, 71, 0.35);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 90;
  animation: rippleOut 0.65s ease-out forwards;
}
@keyframes rippleOut { to { width: 95px; height: 95px; opacity: 0; } }

.flyby {
  position: absolute;
  left: -130px;
  font-size: 46px;
  animation: flyAcross linear forwards;
  filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.15));
  pointer-events: none;
}
@keyframes flyAcross {
  to { transform: translateX(var(--fly, 110vw)) translateY(-40px) rotate(10deg); }
}

.raindrop {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #ffffff;
  border-radius: 18px;
  padding: 8px 13px;
  border: 4px solid #93c5fd;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.12);
  cursor: pointer;
  transition: transform 0.1s;
  animation: bsway 2.2s ease-in-out infinite;
}
.raindrop:hover { transform: scale(1.1); }
.raindrop .re { font-size: 34px; line-height: 1.1; }
.raindrop .rw { font-weight: 900; font-size: 0.82em; }
@keyframes bsway {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

.popflash { animation: popIn 0.4s; }
@keyframes popIn {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.opt:nth-child(1) { animation-delay: 0.03s; }
.opt:nth-child(2) { animation-delay: 0.09s; }
.opt:nth-child(3) { animation-delay: 0.15s; }
.opt:nth-child(4) { animation-delay: 0.21s; }

.gscore .v.bump { display: inline-block; animation: okBounce 0.45s; }

  50% { transform: scale(1.4); color: #f59e0b; }

/* ═══ ERİŞİLEBİLİRLİK & CPU TASARRUFU (WCAG AA & Pil Tasarrufu) ═══ */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;

/* Yardımcı Fonksiyonlar */
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function el(html) {
  try {
    const t = document.createElement('template');
    if (t && t.content && t.content.firstElementChild) {
      t.innerHTML = html.trim();
      if (t.content.firstElementChild) return t.content.firstElementChild;
    }
  } catch (e) {}
  const d = document.createElement('div');
  d.innerHTML = (html || '').trim();
  return d.firstElementChild || d;
}

function pick(arr) {
  if (!arr || !arr.length) return null;
  return arr[Math.floor(Math.random() * arr.length)];
}

function sample(arr, n) {
  if (!arr || !arr.length) return [];
  const sh = shuffle([...arr]);
  return sh.slice(0, Math.min(n, sh.length));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rnd(n) {
  return Math.floor(Math.random() * n);
}

function cap(s) {
  if (!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function EWORDS(u) {
  if (!u || !u.w) return [];
  return u.w.filter(w => w[1] && w[1].trim() !== '');
}

function unitById(id) {
  return ALLSETS.find(u => u.id === id) || null;
}

function unitsOfStage(stageId) {
  return ALLSETS.filter(u => u.stage === stageId);
}

/* Kalıcı Hafıza & Durum Geçmişi (P0 Dayanıklılık / Anti-Crash Kalkanı) */
const store = {
  _mem: {},
  ok: (() => {
    try {
      if (typeof window === 'undefined') return false;
      const ls = window.localStorage;
      if (!ls) return false;
      ls.setItem('__t', '1');
      ls.removeItem('__t');
      return true;
    } catch (e) {
      return false;
    }
  })(),
  get(key) {
    try {
      if (this.ok) {
        const val = localStorage.getItem('polly_' + key);
        return val ? JSON.parse(val) : (this._mem[key] || null);
      }
      return this._mem[key] || null;
    } catch (err) {
      return this._mem[key] || null;
    }
  },
  set(key, val) {
    this._mem[key] = val;
    try {
      if (this.ok) {
        localStorage.setItem('polly_' + key, JSON.stringify(val));
      }
    } catch (err) {
      // // SAFETY: Quota exceeded or private browsing safeguard
    }
  },
  remove(key) {
    delete this._mem[key];
    try {
      if (this.ok) {
        localStorage.removeItem('polly_' + key);
      }
    } catch (err) {}
  },
  /* // PERF: Bounded Ring-Buffer History Ledger (Maks 20 kayıt) */
  pushHistory(entry) {
    try {
      const hist = this.get('history') || [];
      const item = { timestamp: Date.now(), t: Date.now(), ...entry };
      hist.push(item);
      if (hist.length > 20) hist.shift(); // Bound memory growth
      this.set('history', hist);
    } catch (e) {}
  },
  getHistory() {
    return this.get('history') || [];
  },
  clearHistory() {
    this.remove('history');
  },
  /* // SAFETY: Ayrıntılı Checkpoint (Kaldığı Yerden Pürüzsüz Devam İçin) */
  saveCheckpoint(ckpt) {
    try {
      const snap = {
        timestamp: Date.now(),
        ...ckpt
      };
      this.set('checkpoint', snap);
      this.pushHistory({ type: 'checkpoint', ...ckpt });
    } catch (e) {}
  },
  getCheckpoint() {
    return this.get('checkpoint');
  }
};

/* 🎵 Bilinen mevcut ses dosyaları (404 kalkanı — diskte olmayan dosya ağdan istenmez) */
const AVAILABLE_AUDIO = new Set([

const MEDIA = {
  ctx: null,
  voice: null,
  muted: false,

  init() {
    if (this.ctx) {
      try {
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      } catch (e) {}
      return;
    }
    try {
      const AudioCtx = typeof window !== 'undefined' ? (window.AudioContext || window.webkitAudioContext) : null;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    } catch (e) {
      // AudioContext fallback for restricted environments
    }
    try {
      this.muted = !!store.get('muted');
    } catch (e) {}
  },

  toggleMute() {
    this.muted = !this.muted;
    store.set('muted', this.muted);
    if (this.muted) {
      this.stopSpeak();
    }
    return this.muted;
  },

  tone(freq, delay, dur, type = 'sine', gain = 0.1) {
    if (this.muted || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur);
    } catch (e) {}
  },

  slide(startFreq, endFreq, dur, type = 'sine', gain = 0.1) {
    if (this.muted || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(10, endFreq), t0 + dur);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur);
    } catch (e) {}
  },

  noise(dur, gain = 0.08) {
    if (this.muted || !this.ctx) return;
    try {
      const bufferSize = Math.floor(this.ctx.sampleRate * dur);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(gain, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      noise.connect(g);
      g.connect(this.ctx.destination);
      noise.start();
    } catch (e) {}
  },

  fx(name) {
    if (this.muted) return;
    this.init();
    const T = (f, d, l, tp = 'sine', gn = 0.1) => this.tone(f, d, l, tp, gn);

    switch (name) {
      case 'click':
        T(800, 0, 0.03, 'triangle', 0.08);
        break;
      case 'pop':
        this.slide(400, 1100, 0.08, 'sine', 0.15);
        break;
      case 'correct':
        T(523.25, 0, 0.1, 'triangle', 0.12);
        T(659.25, 0.08, 0.1, 'triangle', 0.12);
        T(783.99, 0.16, 0.22, 'triangle', 0.14);
        break;
      case 'wrong':
        T(220, 0, 0.12, 'sawtooth', 0.1);
        T(185, 0.12, 0.25, 'sawtooth', 0.1);
        break;
      case 'hop':

  /* 🎵 Gömülü ses dosyaları (audio/ klasörü — yoksa sessizce TTS'e döner) */
  ac: {},
  playFile(name, vol, loop) {
    try {
      vol = vol == null ? 1 : vol;
      if (this.muted) return null;

      // // SAFETY: Prevent network 404s by verifying file exists in bundled audio or VOICESET
      const isBundleAudio = typeof AVAILABLE_AUDIO !== 'undefined' && AVAILABLE_AUDIO.has(name);
      const isVoiceWord = typeof VOICESET !== 'undefined' && VOICESET.has(name);
      if (!isBundleAudio && !isVoiceWord) {
        return null;
      }

      let a = this.ac[name];
      if (!a) {
        // // PERF: Bellek sınırlandırması (Maksimum 35 eşzamanlı ses nesnesi)
        const keys = Object.keys(this.ac);
        if (keys.length >= 35) {
          const pruneKey = keys.find((k) => this.ac[k] && this.ac[k].paused && !this.ac[k].loop) || keys[0];
          try {
            this.ac[pruneKey].pause();
            this.ac[pruneKey].src = '';
          } catch (e) {}
          delete this.ac[pruneKey];
        }
        a = new Audio('audio/' + name + '.mp3');
        this.ac[name] = a;
        try { a.addEventListener('error', () => { this.ac[name] = false; }, { once: true }); } catch (e) {}
      }
      try { a.currentTime = 0; } catch (e) {}
      try { a.volume = vol; a.loop = !!loop; } catch (e) {}
      try { a.addEventListener('error', () => { a.__pfe = 1; }, { once: true }); } catch (e) {} /* doğal error bayrağı */
      const pr = a.play();
      if (pr && pr.catch) {
        pr.catch(() => {
          /* 🛡️ çalma reddedilirse (otomatik oynatma ilkesi / dosya yok / ağ yok)
             ve 80 ms içinde doğal 'error' olayı gelmezse: bir KEZ yapay error tetikle
             → onended/onerror zincirlerine bağlanan motorlar ASLA takılı kalmaz */
          setTimeout(() => {
            try {
              if (!a.__pfe) {
                a.__pfe = 1;
                a.dispatchEvent(new Event('error'));
              }
            } catch (e) {}
          }, 80);
        });
      }
      return a;
    } catch (e) {
      return null;
    }
  },
  stopMusic(a) {
    try {
      if (a) {
        a.pause();
        a.currentTime = 0;
      }
    } catch (e) {}
  },
  praise() {
    this.fx('win');
    const compliments = [
      'Super!',
      'Great job!',
      'Well done!',
      'Awesome!',
      'Brilliant!',
      'Fantastic!',
      'Amazing!',
      'Super work!'
    ];
    const word = compliments[Math.floor(Math.random() * compliments.length)];
    this.speak(word, 0.95);
    return null;
  },

  /* 🚫 Robotik, mekanik, fısıltılı veya eski sistem seslerini filtreleme */
  isRoboticVoice(v) {
    if (!v) return true;
    const name = String(v.name || '').toLowerCase();
    const lang = String(v.lang || '').toLowerCase();
    if (!/^en/i.test(lang)) return true;
    const robotPattern = /(albert|fred|ralph|junior|kathy|victoria|vicki|bruce|bad news|good news|bahh|bells|boing|bubbles|cellos|deranged|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|david|zira|mark|hazel|george|desktop|espeak|festival|mbrola|sample|compact|mechanical|robot)/i;
    return robotPattern.test(name);
  },

  /* 🌟 Neşeli, doğal ve çocuklara uygun insan sesi puanlama motoru */
  getVoiceScore(v) {
    if (!v || this.isRoboticVoice(v)) return -1000;
    const name = String(v.name || '');
    const lang = String(v.lang || '');
    let score = 50;

    // 🏆 En neşeli, doğal çocuk ve öğretmen sesleri (Polly için mükemmel insan sesleri)
    if (/maisie/i.test(name)) score += 130; // Neşeli İngiliz çocuk sesi
    else if (/ana\b/i.test(name) && /natural/i.test(name)) score += 125; // Neşeli ABD çocuk sesi
    else if (/flo\b/i.test(name)) score += 120; // Canlı, neşeli Apple insan sesi
    else if (/sandy\b/i.test(name)) score += 115; // Sıcak & neşeli Apple insan sesi
    else if (/samantha\b/i.test(name)) score += 110; // Doğal ve neşeli Apple sesi
    else if (/shelley\b/i.test(name)) score += 105; // Neşeli Apple sesi
    else if (/serena\b/i.test(name)) score += 100; // Doğal İngiliz öğretmen sesi
    else if (/sonia\b/i.test(name)) score += 96; // Güler yüzlü İngiliz sesi
    else if (/libby\b/i.test(name)) score += 94; // Sevimli İngiliz sesi
    else if (/jenny\b/i.test(name)) score += 92; // Doğal ve neşeli ABD sesi
    else if (/aria\b/i.test(name)) score += 90; // Canlı ve neşeli ABD sesi
    else if (/ava\b/i.test(name)) score += 88; // Doğal akıcı ses
    else if (/zoe\b/i.test(name)) score += 86; // Canlı ve enerjik ses
    else if (/karen\b/i.test(name)) score += 82; // Sıcak Avustralya sesi
    else if (/moira\b/i.test(name)) score += 80; // Neşeli İrlanda sesi
    else if (/daniel\b/i.test(name)) score += 78; // Net İngiliz sesi
    else if (/eddy\b/i.test(name)) score += 74; // Genç & samimi ses

    // Doğal/Nöral ses belirteçleri
    if (/online \(natural\)/i.test(name)) score += 60;
    if (/\bnatural\b/i.test(name)) score += 50;
    if (/\bneural\b/i.test(name)) score += 50;
    if (/\bpremium\b/i.test(name)) score += 40;
    if (/\benhanced\b/i.test(name)) score += 35;

    // Cambridge müfredatı için aksan önceliği: BK ve ABD
    if (/en[-_]GB/i.test(lang)) score += 20;
    else if (/en[-_]US/i.test(lang)) score += 15;
    else if (/en[-_](AU|CA|IE|NZ)/i.test(lang)) score += 10;

    // Kadın veya çocuk ses tonları ilkokul öğrencileri için daha neşeli ve samimi algılanır
    if (/female|girl|child|kid/i.test(name)) score += 10;

    return score;
  },

  /* 🎙️ Mevcut insan seslerini listeleme (filtreli ve sıralı) */
  getHumanVoices() {
    try {
      const synth = typeof window !== 'undefined' ? window.speechSynthesis : null;
      if (!synth || !synth.getVoices) return [];
      const vs = synth.getVoices() || [];
      return vs
        .filter((v) => !this.isRoboticVoice(v))
        .sort((a, b) => this.getVoiceScore(b) - this.getVoiceScore(a));
    } catch (e) {
      return [];
    }
  },

  pickVoice() {
    try {
      const synth = typeof window !== 'undefined' ? window.speechSynthesis : null;
      if (!synth || !synth.getVoices) return null;
      const vs = synth.getVoices() || [];
      if (!vs.length) return null;

      // Kullanıcı daha önce geçerli bir ses seçtiyse onu koru
      try {
        const saved = store.get('voice');
        if (saved) {
          const match = vs.find((v) => v.name === saved && !this.isRoboticVoice(v));
          if (match) {
            this.voice = match;
            return match;
          }
        }
      } catch (e) {}

      // Sadece neşeli insan seslerini al ve puanlarına göre sırala
      const humanVoices = this.getHumanVoices();
      if (humanVoices.length > 0) {
        this.voice = humanVoices[0];
        return humanVoices[0];
      }

      // Güvenlik yedeği: robotik filtreyi geçen ilk İngilizce ses
      const fallback = vs.find((v) => /^en/i.test(v.lang) && !this.isRoboticVoice(v));
      if (fallback) {
        this.voice = fallback;
        return fallback;
      }

      // Son çare: robotik filtreyi geçen herhangi bir ses
      const anyNonRobot = vs.find((v) => !this.isRoboticVoice(v));
      this.voice = anyNonRobot || null;
      return this.voice;
    } catch (e) {
      return null;
    }
  },
  setVoice(name) {
    try {
      const synth = typeof window !== 'undefined' ? window.speechSynthesis : null;
      if (!synth) return;
      const vs = synth.getVoices ? synth.getVoices() : [];
      const v = vs.find((x) => x.name === name);
      if (v) {
        this.voice = v;
        store.set('voice', name);
      }
    } catch (e) {}
  },

  /* 🎙️ Disney Karakter Ses Profilleri (Perdeler ve Tempomuz Çocuklara Özel) */
  disneyProfiles: {
    mickey:   { pitch: 1.48, rate: 1.05, label: 'Mickey Mouse' },
    donald:   { pitch: 1.35, rate: 1.18, label: 'Donald Duck' },
    goofy:    { pitch: 0.74, rate: 0.85, label: 'Goofy' },
    elsa:     { pitch: 1.25, rate: 0.94, label: 'Elsa' },
    olaf:     { pitch: 1.42, rate: 1.10, label: 'Olaf' },

    mcqueen:  { pitch: 1.12, rate: 1.18, label: 'Lightning McQueen' },
    moana:    { pitch: 1.18, rate: 1.00, label: 'Moana' },
    ariel:    { pitch: 1.28, rate: 0.96, label: 'Ariel' },
    aladdin:  { pitch: 1.15, rate: 1.08, label: 'Aladdin & Genie' },
    peterpan: { pitch: 1.30, rate: 1.08, label: 'Peter Pan' },
    dory:     { pitch: 1.38, rate: 1.12, label: 'Dory & Nemo' },
    judy:     { pitch: 1.24, rate: 1.08, label: 'Judy Hopps' },
    baloo:    { pitch: 0.76, rate: 0.86, label: 'Baloo' },
    incredibles: { pitch: 1.42, rate: 1.22, label: 'Dash' }
  },

  speakDisney(charKey, text, cb, vol) {
    const prof = this.disneyProfiles[charKey] || this.disneyProfiles.mickey;
    this.tts(text, prof.rate, cb, vol, prof.pitch);
  },

  welcomeGreeting(cb) {
    this.fx('win');
    const msg = "Hiya pals! Welcome to Polly's Fun English! I am Mickey Mouse, and together with all our Disney friends, let us explore exciting games, songs, and Baamboozle together!";
    this.speakDisney('mickey', msg, cb);
  },

  /* 🎙️ ANA KONUŞMA — DOĞAL İNSAN SESİ & DİSNEY DESTEĞİ */
  speak(text, rate = 0.9, cb, vol, charKey = null) {
    if (charKey && this.disneyProfiles[charKey]) {
      return this.speakDisney(charKey, text, cb, vol);
    }
    try {
      if (!(typeof window !== 'undefined' && window.__TESTMODE)) {
        const t = String(text || '');
        const slug = 'w-' + t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        if (typeof VOICESET !== 'undefined' && VOICESET.has(slug)) {
          let a = null;
          try {
            a = this.playFile(slug, vol == null ? 1 : vol);
          } catch (e) {}
          if (a) {
            this.stopSpeak();
            let done = false,
              to = null;
            try {
              a.playbackRate = rate >= 0.8 ? 1 : 0.88;
            } catch (e) {}
            const fall = () => {
              if (done) return;
              done = true;
              if (to) clearTimeout(to);
              this.tts(text, rate, cb, vol);
            };
            const fin = () => {
              if (done) return;
              done = true;
              if (to) clearTimeout(to);
              cb && cb();
            };
            if (cb)
              to = setTimeout(() => {
                if (!done) {
                  done = true;
                  cb();
                }
              }, 4000);
            a.onended = fin;
            a.onerror = fall;
            const pr = a.play && a.play();
            if (pr && pr.catch) pr.catch(fall);
            return;
          }
        }
      }
    } catch (e) {}
    this.tts(text, rate, cb, vol);
  },

  /* 🎙️ Tarayıcı TTS — Neşeli, sıcak ve doğal insan sesleri */
  tts(text, rate = 0.9, cb, vol, customPitch = 1.0) {
    if (this.muted) {
      cb && cb();
      return;
    }
    try {
      const synth = typeof window !== 'undefined' ? window.speechSynthesis : null;
      if (!synth) {
        cb && cb();
        return;
      }
      // // SAFETY: Tarayıcı askıda kalmasını (paused) engelle
      if (synth.paused) {
        try { synth.resume(); } catch (e) {}
      }
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      this._currUtt = u; // // SAFETY: V8 Garbage collection erken temizlemesini önle
      if (!this.voice) this.pickVoice();
      if (this.voice) {
        u.voice = this.voice;
        u.lang = this.voice.lang || 'en-GB';
      } else {
        u.lang = 'en-GB';
      }
      u.pitch = customPitch || 1.0;
      const safeRate = Math.max(0.75, Math.min(1.25, rate || 0.9));
      u.rate = safeRate;
      if (vol != null) u.volume = vol;
      
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        if (this._currUtt === u) this._currUtt = null;
        if (cb) cb();
      };
      u.onend = finish;
      u.onerror = finish;
      synth.speak(u);
    } catch (e) {
      cb && cb();
    }
  },

  stopSpeak() {
    try {
      if (typeof window !== 'undefined' && window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    } catch (e) {}
  },

  /* // SAFETY: Cross-OS Audio & TTS Isıtıcı (iOS / Safari / Android kuralı) */
  warmUp() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    try {
      if (typeof window !== 'undefined' && window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0.01;
        window.speechSynthesis.speak(u);
      }
    } catch (e) {}
  },

  /* // PERF: Ekran geçişlerinde bellek ve ses kaynaklarını temizle */
  disposeAll() {
    this.stopSpeak();
    if (this.ac) {
      Object.values(this.ac).forEach((a) => {
        try {
          if (a && a.pause) {
            a.pause();
            a.currentTime = 0;
          }
        } catch (e) {}
      });
    }
  }
};

        api.progress(currentIdx + 1, words.length);
        const displayWord = words[currentIdx][0].toUpperCase();
        const cleanTarget = displayWord.replace(/[^A-Z]/g, '') || displayWord;
        let clicked = '';

        const letters = cleanTarget.split('');
        const fillers = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const totalCells = cfg.grid * cfg.grid;
        const gridLetters = [...letters];
        while (gridLetters.length < totalCells) {
          gridLetters.push(pick(fillers.split('')));
        }
        const shuffledGrid = shuffle(gridLetters);

        api.root.innerHTML = `
          <div class="center">
            <div class="prompt-box">
              <span class="pe">${words[currentIdx][1]}</span>
              <div class="pw">Ara: <b style="color:#7c3aed">${esc(displayWord)}</b> (${esc(words[currentIdx][2])})</div>

            </div>
          </div>`;

        MEDIA.speak(words[currentIdx][0]);
        const statusEl = api.root.querySelector('#srch-status');
        statusEl.textContent = '_ '.repeat(cleanTarget.length);

        api.root.querySelectorAll('.g-cell').forEach(btn => {
          btn.onclick = () => {
            const letter = btn.textContent.trim();
            const nextExpected = cleanTarget[clicked.length];
            if (letter === nextExpected) {
              clicked += letter;
              btn.classList.add('ok');
              btn.disabled = true;
              MEDIA.fx('pop');
              statusEl.textContent = clicked + ' _ '.repeat(cleanTarget.length - clicked.length);

              if (clicked === cleanTarget) {
                MEDIA.fx('correct');
                FX.stars();
                api.add(15);
                currentIdx++;
                setTimeout(round, 700);
              }
            } else {
              MEDIA.fx('wrong');
              FX.shake(btn);
            }
          };
        });
      };
      round();
    }
  },

  /* ---------------- 25) ✍️ HARF & KELİME ÇİZME (TRACING) ---------------- */
  {
    id: 'trace',
    e: '✍️',
    t: 'Harf & Kelime Çizme',
    d: 'Harflerin ve kelimelerin üzerinden geç, doğru yazmayı öğren!',
    stages: [1, 2],
    levels: [
      { n: 'Harf Harf (Büyük Harf)', c: { mode: 'letter', count: 6 } },

      { n: 'Serbest Çizim (Kılavuz Çizgili)', c: { mode: 'free', count: 6 } }
    ],
    init(api) {
      const u = api.unit;
      const cfg = api.lv || {};
      const EW = EWORDS(u);
      const pool = shuffle(EW.length ? EW : [['STAR', '⭐', 'Yıldız', 0]]).slice(0, cfg.count || 6);
      let wordIdx = 0;
      let letterIdx = 0;
      const totalRounds = pool.length;

      let isRainbow = false;
      let rainbowHue = 0;
      let brushSize = 18;
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;
      let checkpoints = [];
      const coveredPoints = new Set();
      let hasCompleted = false;

      const renderRound = () => {
        if (wordIdx >= totalRounds) {
          // // SAFETY / USER-REQ: Puan veya yıldız yok, saf teşvik ve tebrik mesajı
          api.end({ score: totalRounds, max: totalRounds, note: 'Harika bir çalışma! Tüm harfleri başarıyla yazdın! ✍️🎉' });
          return;
        }
        hasCompleted = false;
        coveredPoints.clear();
        checkpoints = [];

        const curWord = pool[wordIdx];
        const wordText = String(curWord[0] || '').toUpperCase();
        const wordEmoji = curWord[1] || '✍️';
        const wordTr = curWord[2] || '';

        const isLetterMode = cfg.mode === 'letter';
        const activeChar = isLetterMode ? (wordText[letterIdx] || wordText[0]) : wordText;

        api.progress(wordIdx + 1, totalRounds);

        api.root.innerHTML = `
          <div class="trace-box">
            <div class="trace-header">
              <div class="trace-word-info">
                <span class="emoji">${wordEmoji}</span>
                <div>
                  <span style="font-size:1.15em;letter-spacing:1px">${esc(curWord[0])}</span>
                  <span class="muted" style="font-size:0.75em;margin-left:6px">(${esc(wordTr)})</span>
                  ${isLetterMode ? `<span class="badge purple" style="margin-left:8px">Harf ${letterIdx + 1}/${wordText.length}: <b>${activeChar}</b></span>` : ''}
                </div>
              </div>
              <div class="trace-guide-wrap">
                <span class="trace-badge" id="t-status">✏️ Harfin üzerinden geç</span>
              </div>
            </div>

            <div class="trace-canvas-wrap" id="tcw">
              <canvas class="trace-canvas" id="tcv"></canvas>
            </div>

            <div class="trace-toolbar">
              <div class="trace-palette">
                <button class="trace-color active" data-color="#8b5cf6" style="background:#8b5cf6" title="Mor"></button>
                <button class="trace-color" data-color="#0ea5e9" style="background:#0ea5e9" title="Mavi"></button>
                <button class="trace-color" data-color="#10b981" style="background:#10b981" title="Yeşil"></button>
                <button class="trace-color" data-color="#f97316" style="background:#f97316" title="Turuncu"></button>
                <button class="trace-color" data-color="#ec4899" style="background:#ec4899" title="Pembe"></button>
                <button class="trace-color" data-color="rainbow" style="background:linear-gradient(135deg,red,orange,yellow,green,blue,indigo,violet)" title="Gökkuşağı"></button>
              </div>
              <div class="trace-actions">
                <button class="btn small white" id="t-spk" title="Seslendir">🔊 Dinle</button>
                <button class="btn small white" id="t-clr" title="Temizle">🗑️ Temizle</button>
                <button class="btn small green" id="t-nxt" title="Sonraki">Sonraki ➡️</button>
              </div>
            </div>
          </div>
        `;

        if (isLetterMode) {
          MEDIA.speak(activeChar);
        } else {
          MEDIA.speak(curWord[0]);
        }

        const canvas = api.root.querySelector('#tcv');
        const wrap = api.root.querySelector('#tcw');
        const statusEl = api.root.querySelector('#t-status');
        if (!canvas || !canvas.getContext) return; // // SAFETY: Headless/test fallback

        const ctx = canvas.getContext('2d');
        if (!ctx) return; // // SAFETY: Missing 2d context guard

        const setupCanvasSize = () => {
          const rect = wrap ? wrap.getBoundingClientRect() : { width: 560, height: 280 };
          const dpr = typeof window !== 'undefined' && window.devicePixelRatio ? Math.min(window.devicePixelRatio, 2) : 1;
          const w = rect.width > 50 ? rect.width : 560;
          const h = rect.height > 50 ? rect.height : 280;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          if (ctx.resetTransform) ctx.resetTransform();
          if (ctx.scale) ctx.scale(dpr, dpr);
          return { w, h };
        };

        const dim = setupCanvasSize();
        const W = dim.w;
        const H = dim.h;

        const drawBackground = () => {
          if (!ctx.clearRect) return;
          ctx.clearRect(0, 0, W, H);

          const yTop = H * 0.22;
          const yMid = H * 0.44;
          const yBase = H * 0.72;
          const yBot = H * 0.90;

          if (ctx.beginPath) {
            // Top line
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1.5;
            if (ctx.setLineDash) ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(16, yTop);
            ctx.lineTo(W - 16, yTop);
            ctx.stroke();

            // Mid dashed line
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;
            if (ctx.setLineDash) ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(16, yMid);
            ctx.lineTo(W - 16, yMid);
            ctx.stroke();
            if (ctx.setLineDash) ctx.setLineDash([]);

            // Baseline (solid coral line)
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(16, yBase);
            ctx.lineTo(W - 16, yBase);
            ctx.stroke();

            // Bottom line (descender)
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(16, yBot);
            ctx.lineTo(W - 16, yBot);
            ctx.stroke();
          }
        };

        const drawTemplate = () => {
          if (!ctx.strokeText || !ctx.fillText) return;
          ctx.save && ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';

          let fontSize = H * 0.48;
          const yPos = H * 0.72;

          if (isLetterMode) {
            fontSize = Math.min(H * 0.65, 170);
            ctx.font = `900 ${fontSize}px "Comic Sans MS", "Chalkboard SE", "Nunito", sans-serif`;
          } else {
            fontSize = Math.min(H * 0.42, 95);
            ctx.font = `900 ${fontSize}px "Comic Sans MS", "Chalkboard SE", "Nunito", sans-serif`;
          }

          ctx.strokeStyle = cfg.mode === 'free' ? 'rgba(203, 213, 225, 0.35)' : '#94a3b8';
          ctx.lineWidth = isLetterMode ? 8 : 5;
          if (ctx.setLineDash) ctx.setLineDash([8, 6]);
          ctx.strokeText(activeChar, W / 2, yPos);

          ctx.fillStyle = 'rgba(241, 245, 249, 0.55)';
          ctx.fillText(activeChar, W / 2, yPos);
          if (ctx.setLineDash) ctx.setLineDash([]);
          ctx.restore && ctx.restore();

          if (checkpoints.length === 0) {
            const stepX = isLetterMode ? 14 : 20;
            const stepY = 16;
            const startX = W * 0.20;
            const endX = W * 0.80;
            const startY = H * 0.24;
            const endY = H * 0.74;
            let idCount = 0;
            for (let px = startX; px <= endX; px += stepX) {
              for (let py = startY; py <= endY; py += stepY) {
                checkpoints.push({ id: idCount++, x: px, y: py });
              }
            }
          }
        };

        drawBackground();
        drawTemplate();

        const getPos = (e) => {
          const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
          return {
            x: (e.clientX || 0) - r.left,
            y: (e.clientY || 0) - r.top
          };
        };

        const checkHit = (x, y) => {
          if (hasCompleted || !checkpoints.length) return;
          const radius = brushSize * 1.5;
          for (let k = 0; k < checkpoints.length; k++) {
            const cp = checkpoints[k];
            if (!coveredPoints.has(cp.id)) {
              const dx = cp.x - x;
              const dy = cp.y - y;
              if (dx * dx + dy * dy <= radius * radius) {
                coveredPoints.add(cp.id);
              }
            }
          }

          // // PERF / SAFETY / USER-REQ: Esnek harf algılama — tüm boşlukları boyamaya gerek yok!
          // Öğrencinin harfin üzerinden bir miktar geçmesi yeterlidir, puan/yıldız baskısı yok.
          const minHits = Math.min(5, Math.max(3, Math.floor(checkpoints.length * 0.12)));
          if (coveredPoints.size >= minHits && !hasCompleted) {
            hasCompleted = true;
            if (statusEl) {
              statusEl.innerHTML = '✨ Harika yazdın! 👏';
              statusEl.classList.add('success');
            }
            MEDIA.fx('correct');
            FX.confetti(22);
            const praiseList = ['Super!', 'Great writing!', 'Well done!', 'Awesome!'];
            MEDIA.speak(praiseList[Math.floor(Math.random() * praiseList.length)]);

            setTimeout(() => {
              if (isLetterMode && letterIdx < wordText.length - 1) {
                letterIdx++;
              } else {
                letterIdx = 0;
                wordIdx++;
              }
              renderRound();
            }, 900);
          }
        };

        const startDraw = (e) => {
          e.preventDefault && e.preventDefault();
          isDrawing = true;
          const p = getPos(e);
          lastX = p.x;
          lastY = p.y;
          checkHit(p.x, p.y);
        };

        const moveDraw = (e) => {
          if (!isDrawing) return;
          e.preventDefault && e.preventDefault();
          const p = getPos(e);

          if (ctx.beginPath && ctx.moveTo && ctx.lineTo && ctx.stroke) {
            ctx.save && ctx.save();
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(p.x, p.y);

            if (isRainbow) {
              rainbowHue = (rainbowHue + 4) % 360;
              ctx.strokeStyle = `hsl(${rainbowHue}, 90%, 55%)`;
            } else {
              ctx.strokeStyle = currentColor;
            }

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore && ctx.restore();
          }

          lastX = p.x;
          lastY = p.y;
          checkHit(p.x, p.y);
        };

        const stopDraw = () => {
          isDrawing = false;
          if (!hasCompleted && coveredPoints.size >= 3) {
            checkHit(lastX, lastY);
          }
        };

        canvas.addEventListener('pointerdown', startDraw);
        canvas.addEventListener('pointermove', moveDraw);
        canvas.addEventListener('pointerup', stopDraw);
        canvas.addEventListener('pointercancel', stopDraw);

        api.root.querySelectorAll('.trace-color').forEach((b) => {
          b.onclick = () => {
            api.root.querySelectorAll('.trace-color').forEach((x) => x.classList.remove('active'));
            b.classList.add('active');
            const col = b.dataset.color;
            if (col === 'rainbow') {
              isRainbow = true;
            } else {
              isRainbow = false;
              currentColor = col;
            }
            MEDIA.fx('click');
          };
        });

        const spkBtn = api.root.querySelector('#t-spk');
        if (spkBtn) {
          spkBtn.onclick = () => {
            MEDIA.fx('click');
            if (isLetterMode) MEDIA.speak(activeChar);
            else MEDIA.speak(curWord[0]);
          };
        }

        const clrBtn = api.root.querySelector('#t-clr');
        if (clrBtn) {
          clrBtn.onclick = () => {
            if (hasCompleted) return;
            MEDIA.fx('whoosh');
            coveredPoints.clear();
            if (statusEl) {
              statusEl.innerHTML = '✏️ Harfin üzerinden geç';
              statusEl.classList.remove('success');
            }
            hasCompleted = false;
            drawBackground();
            drawTemplate();
          };
        }

        const nxtBtn = api.root.querySelector('#t-nxt');
        if (nxtBtn) {
          nxtBtn.onclick = () => {
            if (hasCompleted) return;
            MEDIA.fx('click');
            if (isLetterMode && letterIdx < wordText.length - 1) {
              letterIdx++;
            } else {
              letterIdx = 0;
              wordIdx++;
            }
            renderRound();
          };
        }
      };

      renderRound();
    }
  },

      this.bar() +
      `

     <span class="ue">🎵</span><div><h2 style="color:#fff">Şarkı & Chant Köşesi</h2>

      this.bar() +
      `

  /* ---------- 🏆 SKORLAR ---------- */
  vScores() {
    const b = store.get('best') || {};
    const rows = Object.keys(b)
      .map((k) => {
        const [eid, uid, lv] = k.split('|');
        const u = unitById(uid),
          e = ENGINES.find((x) => x.id === eid);
        return u && e ? { u, e, lv: +lv, s: b[k].s, st: b[k].st } : null;
      })
      .filter(Boolean)
      .sort((a, c) => c.s - a.s)
      .slice(0, 40);
    const tot = Object.values(b).reduce((a, x) => a + (x.st || 0), 0);
    return (
      this.bar() +
      `
   <div class="center" style="min-height:120px">
     <div class="big-emoji" style="font-size:64px">🏆</div>
     <div class="pw" style="font-size:1.6em;margin:6px 0">Toplam ${tot} ⭐ toplanmış!</div>
     <button class="btn small white" id="rst">🗑️ Skorları Sıfırla</button>
   </div>
   <table class="score-table"><tr><th>Oyun</th><th>Ünite</th><th>Seviye</th><th>Puan</th><th>Yıldız</th></tr>
   ${
     rows
       .map(
         (r) => `<tr><td>${r.e.e} ${r.e.t}</td><td>${r.u.emoji} ${esc(r.u.tr)}</td>
     <td>${r.e.levels[r.lv] ? r.e.levels[r.lv].n : '1'}</td><td><b>${r.s}</b></td><td>${'⭐'.repeat(r.st)}</td></tr>`
       )
       .join('') ||
     '<tr><td colspan="5" class="muted" style="text-align:center;padding:18px">Henüz skor yok — haydi oyna! 🎮</td></tr>'
   }</table>`
    );
  },

  /* ---------- Seviye Seçme Modalı ---------- */
  pickLevel(eid) {
    const e = ENGINES.find((x) => x.id === eid);
    if (!e) return;
    const ov = el(`<div class="overlay"><div class="modal">
     <h3>${e.e} ${e.t}</h3><div class="muted" style="margin-bottom:10px">${e.d}</div>
     <div class="lvl-row" style="justify-content:center">${e.levels
       .map(
         (l, i) =>
           `<button class="lvl-pill" data-l="${i}">${'🟢🟡🔴'[i] || '🎯'} ${l.n}</button>`
       )
       .join('')}</div></div></div>`);
    document.body.appendChild(ov);
    ov.addEventListener('click', (ev) => {
      if (ev.target === ov) ov.remove();
      const b = ev.target.closest('[data-l]');
      if (b) {
        ov.remove();
        MEDIA.fx('whoosh');
        this.go('game', { engineId: eid, unitId: this.unitId, lvIdx: +b.dataset.l });
      }
    });
  },

  /* ---------- Oyunu Başlat ---------- */
  mountGame() {
    const area = document.getElementById('garea');
    if (!area) return;
    const u = unitById(this.unitId),
      e = ENGINES.find((x) => x.id === this.engineId);
    if (!u || !e) return;
    const self = this;
    let score = this.restoredScore || 0;
    this.currentScore = score;

    const upd = () => {
      const s = document.getElementById('gsc');
      if (s) {
        s.textContent = score;
        s.classList.remove('bump');
        void s.offsetWidth;
        s.classList.add('bump');
      }
    };

    let isDestroyed = false;
    self.cleanups.push(() => {
      isDestroyed = true;
    });

    const api = {
      root: area,
      unit: u,
      lv: e.levels[this.lvIdx] ? e.levels[this.lvIdx].c : {},
      score: score,
      isDestroyed: () => isDestroyed,
      add(n) {
        if (isDestroyed) return;
        score += n;
        self.currentScore = score;
        this.score = score;
        upd();
        store.saveCheckpoint({
          scr: 'game',
          stage: self.stage,
          unitId: u.id,
          engineId: e.id,
          lvIdx: self.lvIdx,
          score: score
        });
        if (score > 0 && score % 60 === 0) {
          const p = pick(PRAISE);
          FX.mascotSay(p + ' 🦜');
          MEDIA.speak(p);
          FX.confetti(30);
          MEDIA.fx('cheer');
        }
      },
      progress(c, t) {
        if (isDestroyed) return;
        const p = Math.min(100, Math.round((c / t) * 100));
        const b = document.getElementById('gtbi');
        if (b) b.style.width = p + '%';
        const pc = document.getElementById('gpc');
        if (pc) pc.textContent = p + '%';
      },
      info(html) {
        if (isDestroyed) return null;
        const i = document.getElementById('ginfo');
        if (i) {
          i.innerHTML = html;
          return i.firstElementChild || i;
        }
        return null;
      },
      speak: (t, r, cb) => !isDestroyed && MEDIA.speak(t, r, cb),
      fx: (n) => !isDestroyed && MEDIA.fx(n),
      cleanup(f) {
        self.cleanups.push(f);
      },
      restart() {
        self.go('game', {
          engineId: self.engineId,
          unitId: self.unitId,
          lvIdx: self.lvIdx
        });
      },
      end(res) {
        if (isDestroyed) return;
        isDestroyed = true;
        self.cleanup();
        MEDIA.stopSpeak();
        const pct = res.max ? res.score / res.max : 1;
        const st = pct >= 0.85 ? 3 : pct >= 0.55 ? 2 : 1;
        const key = e.id + '|' + u.id + '|' + self.lvIdx,
          b = store.get('best') || {};
        if (!b[key] || b[key].s < res.score) {
          b[key] = { s: res.score, st: Math.max(st, b[key] ? b[key].st : 0) };
          store.set('best', b);
        } else if (b[key].st < st) {
          b[key].st = st;
          store.set('best', b);
        }
        FX.confetti(60);
        MEDIA.fx('win');
        area.innerHTML = `<div class="center" style="padding:24px 16px">
         <div style="font-size:52px;margin-bottom:8px">🎉 🏆 🎉</div>
         <div class="pw" style="font-size:1.6em;color:var(--c-primary);font-weight:900">Harika İş Çıkardın!</div>
         <div class="muted" style="margin-top:6px;font-size:1em">${res.note || 'Tebrikler! Bu aktiviteyi başarıyla tamamladın.'}</div>
         <div class="row" style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">
           <button class="btn green" id="rag">🔁 Tekrar Oyna</button>
           <button class="btn gold" id="rbaam">🧩 Baamboozle Takım Oyunu</button>
           <button class="btn blue" id="run">➡️ Ünite Menüsü</button>
         </div></div>`;
        const rag = area.querySelector('#rag');
        if (rag) rag.onclick = () => api.restart();
        const rbaam = area.querySelector('#rbaam');
        if (rbaam) rbaam.onclick = () => self.go('game', { engineId: 'baamboozle', unitId: u.id, lvIdx: 0 });
        const run = area.querySelector('#run');
        if (run) run.onclick = () => self.go('unit', { unitId: u.id });
      }
    };

    upd();
    try {
      e.init(api);
    } catch (err) {
      // // SAFETY: Motor hata verse dahi beyaz ekran olmasını engelle, puanı koru ve kurtar
      console.error(`[EngineIsolation] Error in engine ${e.id}:`, err);
      store.saveCheckpoint({
        scr: 'game',
        stage: self.stage,
        unitId: u.id,
        engineId: e.id,
        lvIdx: self.lvIdx,
        score: score,
        error: String(err && err.message)
      });
      area.innerHTML = `<div class="center" style="padding:22px;background:#fff;border-radius:22px;border:3px dashed #f59e0b;margin:16px auto;max-width:480px">
        <div class="big-emoji" style="font-size:54px">🦜</div>
        <h3 style="margin:8px 0;color:#0f172a">Polly bir aksilik yakaladı ve çözdü!</h3>
        <p style="color:#64748b;margin-bottom:14px">Toplanan puanın (${score} ⭐) hafızada güvende.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn green" id="rec-restart">🔄 Yeniden Başlat</button>
          <button class="btn white" id="rec-unit">📚 Üniteye Dön</button>
        </div>
      </div>`;
      const rb = area.querySelector('#rec-restart'),
        ub = area.querySelector('#rec-unit');
      if (rb) rb.onclick = () => api.restart();
      if (ub) ub.onclick = () => self.go('unit', { unitId: u.id });
    }
  },

  /* ---------- Şarkı Oynatıcı ---------- */
  mountPlayer() {
    const s = this.playing;
    if (!s) return;
    let idx = 0,
      slow = false,
      running = false,
      timer = null;
    const lines = [...document.querySelectorAll('#ly .line')];
    const mel = typeof melodyFor === 'function' ? melodyFor(s) : null;
    const bt = 'beat' + ([...(s.t || 'x')].reduce((a, c) => a + c.codePointAt(0), 0) % (typeof BEATN !== 'undefined' ? BEATN : 6));
    let mus = null,
      music = true;
    const musStop = () => {
      if (mus) {
        MEDIA.stopMusic(mus);
        mus = null;
      }
    };
    const musStart = () => {
      musStop();
      if (!music) return;
      if (mel) {
        mus = MEDIA.playFile(mel, 0.8, true) || MEDIA.playFile(bt, 0.4, true);
      } else {
        mus = MEDIA.playFile(bt, 0.4, true);
      }
    };
    const duck = (v) => {
      if (mus) {
        try {
          mus.volume = v;
        } catch (e) {}
      }
    };
    const stop = () => {
      running = false;
      clearTimeout(timer);
      MEDIA.stopSpeak();
      musStop();
      lines.forEach((l) => l.classList.remove('active'));
    };
    this.cleanups.push(stop);

    const step = () => {
      if (!running) return;
      if (idx >= lines.length) {
        stop();
        FX.mascotSay('Bravo! 🎉 Bir daha söyleyelim mi?');
        return;
      }
      lines.forEach((l) => l.classList.remove('active'));
      const ln = lines[idx];
      if (ln) {
        ln.classList.add('active');
        if (ln.scrollIntoView) {
          try {
            ln.scrollIntoView({ block: 'center', behavior: 'smooth' });
          } catch (e) {}
        }
        FX.notes(innerWidth / 2, innerHeight - 160);
        const txt = ln.textContent.replace(/[^\w\s'’,.!?-]/g, '').trim() || 'la la la';
        duck(0.22);
        MEDIA.speak(txt, slow ? 0.7 : 0.85, () => {
          if (!running) return;
          duck(0.8);
          timer = setTimeout(() => {
            idx++;
            step();
          }, 550);
        });
      }
    };

    const pp = document.getElementById('pp');
    if (pp) {
      pp.onclick = () => {
        MEDIA.fx('click');
        running = true;
        idx = 0;
        musStart();
        step();
      };
    }
    const pr = document.getElementById('pr');
    if (pr) {
      pr.onclick = () => {
        MEDIA.fx('click');
        stop();
        running = true;
        idx = 0;
        setTimeout(() => {
          musStart();
          step();
        }, 150);
      };
    }
    const ps = document.getElementById('ps');
    if (ps) {
      ps.onclick = (e) => {
        slow = !slow;
        e.target.textContent = slow ? '🐇 Normal' : '🐢 Yavaş';
        MEDIA.fx('click');
      };
    }
    const pm = document.getElementById('pm');
    if (pm) {
      pm.onclick = (e) => {
        music = !music;
        e.target.textContent = music ? '🎵 Müzik: Açık' : '🎵 Müzik: Kapalı';
        MEDIA.fx('click');
        if (music && running) musStart();
        else musStop();
      };
    }
    const pa = document.getElementById('pa');
    if (pa) {
      pa.onclick = () => {
        MEDIA.fx('click');
        stop();
      };
    }

  showVoices() {

      if (/maisie/i.test(n)) {

        badge = '🦜 Polly’nin Favorisi';

        icon = '🎉';

        desc = 'Sıcak & Dost Canlısı Ses';
        badge = '✨ Sevimli';
        icon = '🌸';
      } else if (/samantha\b/i.test(n)) {
        desc = 'Doğal & Güler Yüzlü İnsan Sesi';
        badge = '⭐ Çok Popüler';
        icon = '👩';

        desc = 'Neşeli & Açık İnsan Sesi';
        badge = '🌸 Neşeli';

        desc = 'Doğal İngiliz Öğretmen Sesi';

        icon = '👩‍🏫';

  mountLesson() {
    const u = unitById(this.unitId);
    if (!u || !LESSONS[u.id]) return;
    const L = LESSONS[u.id],
      total = L.length + 4,
      n = this.lesIdx || 0;
    // // SAFETY: Ders slayt durumu hafızaya kaydedilir (çökme/yenileme kurtarma)
    store.saveCheckpoint({
      scr: 'lesson',
      stage: this.stage,
      unitId: u.id,
      lesIdx: n,
      timestamp: Date.now()
    });
    if (n === 0) MEDIA.speak("Ready? Let's begin!");
    if (n === L.length) MEDIA.speak('Our new words!');
    if (n === L.length + 1) MEDIA.speak('Show me!');
    if (n === L.length + 2) MEDIA.speak('Watch the video!');
    if (n === L.length + 3) {
      MEDIA.speak('Well done! You completed the lesson!');
      FX.confetti(70);
      MEDIA.fx('win');
    }
    const say = (t, r) => MEDIA.speak(t, r || 0.88);
    const prev = document.getElementById('lprev'),
      next = document.getElementById('lnext');
    if (prev)
      prev.onclick = () => {
        MEDIA.fx('click');
        this.lesIdx = Math.max(0, n - 1);
        this.render();
      };
    if (next)
      next.onclick = () => {
        MEDIA.fx('pop');
        if (n >= total - 1) this.go('unit', { unitId: u.id });
        else {
          this.lesIdx = n + 1;
          this.render();
        }
      };
    if (n < L.length) {
      const s = L[n];
      const b1 = document.getElementById('lL'),
        b2 = document.getElementById('lS'),
        b3 = document.getElementById('lR');
      if (b1)
        b1.onclick = () => {
          MEDIA.fx('click');
          say(s[1]);
        };
      if (b2)
        b2.onclick = () => {
          MEDIA.fx('click');
          say(s[1], 0.78);
        };
      if (b3)
        b3.onclick = () => {
          MEDIA.fx('magic');
          MEDIA.speak('Listen and repeat!', 0.92, () => say(s[1]));
        };
      document.querySelectorAll('.ldrill [data-d]').forEach(
        (b) =>
          (b.onclick = () => {
            const d = b.dataset.d;
            MEDIA.fx('click');
            const drillPrompt = {
              tog: 'Together!',
              boys: 'Boys!',
              girls: 'Girls!',
              loud: 'Loud!',
              whis: 'Whisper!',
              clap: 'Clap!',
              once: 'One more time!'
            }[d];
            const after = () => {
              if (d === 'loud') MEDIA.speak(s[1], 0.95, null, 1);
              else if (d === 'whis') MEDIA.speak(s[1], 0.82, null, 0.4);
              else if (d === 'clap') {
                FX.confetti(14);
                MEDIA.speak(s[1], 0.88);
              } else say(s[1]);
            };
            if (drillPrompt) {
              MEDIA.speak(drillPrompt, 0.95, after);
            } else {
              after();
            }
          })
      );
    }
    if (n === L.length) {
      document.querySelectorAll('.lword').forEach(
        (b) =>
          (b.onclick = () => {
            const w = u.w[+b.dataset.i];
            MEDIA.fx('pop');
            b.classList.add('lit');
            setTimeout(() => b.classList.remove('lit'), 700);
            MEDIA.speak(w[0], 0.88);
            FX.notes(innerWidth / 2, innerHeight - 140);
          })
      );
    }
    if (n === L.length + 1) {
      /* 🎯 mini quiz */
      const qw = shuffle(u.w.filter((w) => w[1])).slice(0, 4);
      const box = document.getElementById('lquiz');
      if (box && qw.length) {
        let qi = 0;
        const drawQ = () => {
          if (qi >= qw.length) {
            box.innerHTML = `<div class="lqdone">🎉🌟🎉<div class="len" style="margin-top:8px">You know the words!</div><div class="ltr">Kelime şampiyonusunuz!</div></div>`;
            MEDIA.speak('Well done! You know the words!');
            FX.confetti(60);
            return;
          }
          const cur = qw[qi];
          const opts = shuffle([cur, ...sample(u.w.filter((w) => w[1] && w[0] !== cur[0]), 2)]);
          box.innerHTML = `<div class="lqq">Show me the <b>${esc(cur[0])}</b>!</div>
            <div class="lqopts">${opts.map((o) => `<button class="lqopt" data-ok="${o[0] === cur[0] ? 1 : 0}"><span>${o[1]}</span></button>`).join('')}</div>
            <div class="lqstars">${'⭐'.repeat(qi)}${'☆'.repeat(qw.length - qi)}</div>`;
          MEDIA.speak(cur[0], 0.88);
          box.querySelectorAll('.lqopt').forEach((ob) => (ob.onclick = () => {
            if (ob.dataset.ok === '1') {
              ob.classList.add('ok');
              MEDIA.fx('correct');
              FX.confetti(24);
              MEDIA.speak('Yes!');
              setTimeout(() => {
                qi++;
                drawQ();
              }, 1100);
            } else {
              ob.classList.add('no');
              FX.shake(ob);
              MEDIA.fx('wrong');
              MEDIA.speak('Try again!');
            }
          }));
        };
        drawQ();
      }
    }
    if (n === L.length + 2) {
      document.querySelectorAll('.video-pill-btn[data-lvid]').forEach((b) => {
        b.onclick = () => {
          document.querySelectorAll('.video-pill-btn[data-lvid]').forEach((x) => x.classList.remove('active'));
          b.classList.add('active');
          const vf = document.getElementById('les-video-frame');
          const vt = document.getElementById('les-video-title');
          if (vf) vf.src = `https://www.youtube-nocookie.com/embed/${b.dataset.lvid}?rel=0`;
          if (vt) vt.textContent = b.dataset.ltit;
        };
      });
    }
    if (n === L.length + 3) {
      const p = document.getElementById('lP'),
        b = document.getElementById('lB');
      if (p)
        p.onclick = () => {
          MEDIA.fx('whoosh');
          MEDIA.speak('Bye bye!');
          setTimeout(() => this.go('unit', { unitId: u.id }), 500);
        };
      if (b)
        b.onclick = () => {
          MEDIA.fx('click');
          this.lesIdx = 0;
          this.render();
        };
    }
  },

  /* ---------- Gökyüzü Dekoru (P1: Düşük CPU / RAM) ---------- */
  floaties() {
    const f = document.getElementById('floaties');
    if (!f) return;
    const em = ['☁️', '🎈', '⭐', '🦋', '🪁', '🌸', '🍃', '💫', '🐝', '☁️'];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span');
      s.textContent = em[i % em.length];
      s.style.left = Math.random() * 96 + '%';
      s.style.fontSize = 24 + Math.random() * 24 + 'px';
      s.style.animationDuration = 14 + Math.random() * 14 + 's';
      s.style.animationDelay = -Math.random() * 18 + 's';
      f.appendChild(s);
    }
  }
};

/* ---------- ANTİ-CRASH SHIELD (Global Hata Yakalayıcı & Otomatik Kurtarma) ---------- */
function handleGlobalCrash(err, type = 'error') {
  // // SAFETY: P0 Asla Çökme Kuralı — global hataları yakala, hafızaya işle ve kurtarma UI göster
  console.error(`[Anti-Crash Shield] Intercepted ${type}:`, err);
  if (typeof store !== 'undefined' && store.pushHistory) {
    store.pushHistory({
      type: 'crash',
      error: String(err && err.message ? err.message : err),
      timestamp: Date.now()
    });
  }

  const banner = document.getElementById('crash-banner');
  if (!banner) return;
  banner.classList.add('show');

  const diag = document.getElementById('crash-diag');
  if (diag) {
    const hist = (typeof store !== 'undefined' && store.getHistory ? store.getHistory() : [])
      .slice(-5)
      .map((h) => `${new Date(h.timestamp).toLocaleTimeString()}: ${h.action || h.type || 'olay'}`)
      .join('\n');
    diag.textContent = `Hata Detayı: ${err && err.message ? err.message : err}\n\nYığın İzleme:\n${(err && err.stack) || 'Bilgi yok'}\n\nSon 5 İşlem Geçmişi:\n${hist || 'Kayıt yok'}`;
  }

  const toggleBtn = document.getElementById('crash-toggle-diag');
  if (toggleBtn && diag) {
    toggleBtn.onclick = () => {
      diag.classList.toggle('show');
    };
  }

  const resBtn = document.getElementById('crash-resume');
  if (resBtn) {
    resBtn.onclick = () => {
      banner.classList.remove('show');
      if (diag) diag.classList.remove('show');
      APP.restoreLastState();
    };
  }

  const hmBtn = document.getElementById('crash-home');
  if (hmBtn) {
    hmBtn.onclick = () => {
      banner.classList.remove('show');
      if (diag) diag.classList.remove('show');
      APP.go('home');
    };
  }
}

if (typeof window !== 'undefined') {
  window.addEventListener('error', (event) => {
    handleGlobalCrash(event.error || event.message, 'uncaught-error');
  });

  window.addEventListener('unhandledrejection', (event) => {
    handleGlobalCrash(event.reason, 'unhandled-rejection');
  });
}

/* ---------- DOKUNMA DALGASI & UÇAN SÜRPRİZLER ---------- */
if (typeof document !== 'undefined') {
  document.addEventListener(
    'pointerdown',
    (ev) => {
      // // PERF: Sadece görünür ekranlarda hafif dalga efekti
      if (ev.clientY < 60) return; // Topbar tıklamalarını rahatlat
      const r = document.createElement('i');
      r.className = 'ripple';
      r.style.left = ev.clientX + 'px';
      r.style.top = ev.clientY + 'px';
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 700);
    },
    { passive: true }
  );
}

// // PERF: Uçan maskotlar arka planda veya oyun esnasında çalışmaz (CPU/GPU tasarrufu)
setInterval(() => {
  if (typeof APP !== 'undefined' && APP.scr === 'game') return;
  if (typeof document !== 'undefined' && document.hidden) return;
  const L = typeof document !== 'undefined' ? document.getElementById('fxlayer') : null;
  if (L && Math.random() < 0.35 && L.querySelectorAll('.flyby').length < 2) {
    const b = document.createElement('span');
    b.className = 'flyby';
    b.textContent = pick(['🕊️', '🦋', '🎈', '🦜', '🚀', '🐝', '🪁']);
    const dur = 6 + Math.random() * 5;
    b.style.top = 8 + rnd(38) + 'vh';
    b.style.animationDuration = dur + 's';
    b.style.setProperty('--fly', window.innerWidth + 160 + 'px');
    L.appendChild(b);
    setTimeout(() => b.remove(), dur * 1000 + 500);
  }
}, 9000);

/* ---------- UYGULAMAYI BAŞLAT (Cross-OS & Safe Autoplay) ---------- */
if (typeof document !== 'undefined') {
  APP.floaties();
  APP.render();

  // // SAFETY: iOS Safari, Android Chrome ve Akıllı Tahtalarda ses ve sentezleyiciyi güvenle uyandır
  const warmAudio = () => {
    MEDIA.warmUp();
    MEDIA.init();
  };
  ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((evType) => {
    document.addEventListener(evType, warmAudio, { capture: true, passive: true, once: true });
  });

  if (typeof window !== 'undefined' && window.speechSynthesis) {
    try {
      const initVoices = () => {
        MEDIA.pickVoice();
      };
      speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    } catch (e) {}
  }
  FX.mascotSay('Merhaba! Ben Polly 🦜 Bir sınıf seç ve başlayalım!', 4500);
}

  </script>
