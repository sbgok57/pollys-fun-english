  <script>
  /* 🛡️ P0 ANTI-CRASH SHIELD v8 — Error containment & safe execution */
  window.__EARLY = 0;
  window.addEventListener('error', function() { window.__EARLY++; });
  window.addEventListener('unhandledrejection', function() { window.__EARLY++; });

  <!-- Decorative Sky Floating Elements -->
  <div id="floaties" aria-hidden="true"></div>

  <!-- Anti-Crash Recovery Banner (P0 Reliability) -->
  <div id="crash-banner" role="alert">
    <div style="font-weight:900;font-size:1.1em;color:#991b1b;margin-bottom:4px">⚠️ Polly Prevented an Issue!</div>
    <div id="crash-msg" style="font-size:0.88em;color:#475569;margin-bottom:10px">Don't worry! Your stars and progress are safely saved. You can resume right where you left off.</div>
    <pre id="crash-diag" class="crash-details"></pre>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn small green" id="crash-resume">🔄 Resume Play</button>
      <button class="btn small white" id="crash-home">🏠 Home</button>
      <button class="btn small white" id="crash-toggle-diag" style="font-size:0.75em;opacity:0.75">🔍 Details</button>
    </div>
  </div>

  <!-- Ana Uygulama Kapsayıcısı -->
  <main id="app"></main>
