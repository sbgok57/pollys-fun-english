<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Polly’s Fun English — Cambridge Global English 1 & 2</title>
  <meta name="description" content="İlkokul 1 ve 2. Sınıf İngilizce Eğitsel Oyun ve Şarkı Platformu">
  <meta name="theme-color" content="#4f46e5">
  <style>
/* ============================================================
   🎨 POLLY'S FUN ENGLISH — CSS TASARIM SİSTEMİ (v2)
   Çocuk dostu, yüksek kontrastlı, akıllı tahta ve dokunmatik uyumlu
   ============================================================ */

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --accent: #f59e0b;
  --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fdf2f8 100%);
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;
  --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --shadow-float: 0 14px 28px rgba(0, 0, 0, 0.12);
  --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Comic Sans MS', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  font-family: var(--font-family);
  background: var(--bg-gradient);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  line-height: 1.4;
}

body.s1 {
  background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 50%, #e0f2fe 100%);
}

body.s2 {
  background: linear-gradient(135deg, #eff6ff 0%, #ede9fe 50%, #fdf2f8 100%);
}

#floaties {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

#floaties span {
  position: absolute;
  bottom: -60px;
  animation: floatUp linear infinite;
  opacity: 0.6;
}

@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  90% { opacity: 0.7; }
  100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
}

#fxlayer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  overflow: hidden;
}

#app {
  position: relative;
  z-index: 10;
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 16px 40px;
}

/* ═══ TOPBAR ═══ */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  border: 2px solid #e2e8f0;
}

.brand {
  font-weight: 900;
  color: #1e1b4b;
  font-size: 1.15em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.spacer {
  flex: 1;
}

.badge {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-weight: 800;
  font-size: 0.88em;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.badge.gold { background: #fef3c7; color: #b45309; }
.badge.blue { background: #dbeafe; color: #1d4ed8; }
.badge.purple { background: #f3e8ff; color: #6b21a8; }
.badge.red { background: #fee2e2; color: #dc2626; }

/* ═══ BUTONLAR ═══ */
.btn {
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 900;
  border-radius: var(--radius-full);
  padding: 12px 22px;
  font-size: 1em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
  min-height: 44px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
.btn:hover { transform: translateY(-2px); }
.btn.small { padding: 6px 14px; font-size: 0.9em; min-height: 38px; }
.btn.white { background: #ffffff; color: #1e293b; border: 2px solid #cbd5e1; }
.btn.blue { background: #3b82f6; color: #ffffff; }
.btn.green { background: #10b981; color: #ffffff; }
.btn.purple { background: #8b5cf6; color: #ffffff; }
.btn.red { background: #ef4444; color: #ffffff; }

/* ═══ HERO & ANA SAYFA ═══ */
.hero {
  text-align: center;
  padding: 16px 10px 10px;
}
.mascot {
  font-size: clamp(64px, 12vw, 92px);
  cursor: pointer;
  display: inline-block;
  animation: mascotHop 3.5s infinite ease-in-out;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
}
@keyframes mascotHop {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  45% { transform: translateY(-14px) rotate(4deg); }
  55% { transform: translateY(-14px) rotate(-4deg); }
}
.tag {
  color: #4338ca;
  font-weight: 800;
  font-size: clamp(0.95em, 2vw, 1.2em);
  margin-top: 6px;
}

.stats-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin: 18px 0;
}
.stat {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 10px 18px;
  border: 2px solid #e2e8f0;
  font-size: 0.92em;
  font-weight: 800;
  color: #334155;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat b { color: #4f46e5; font-size: 1.15em; }

.stage-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
  margin-top: 18px;
}
.stage-card {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 24px;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  transition: transform 0.2s, box-shadow 0.2s;
  border: 4px solid transparent;
  position: relative;
  overflow: hidden;
}
.stage-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-float);
}
.stage-card.s1 { border-color: #86efac; background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%); }
.stage-card.s2 { border-color: #93c5fd; background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%); }
.stage-card.songs { border-color: #f472b6; background: linear-gradient(180deg, #fdf2f8 0%, #ffffff 100%); }
.sc-emoji { font-size: 46px; display: block; margin-bottom: 8px; }
.stage-card h2 { font-size: 1.45em; color: #0f172a; margin-bottom: 6px; font-weight: 900; }
.stage-card p { color: #64748b; font-size: 0.92em; font-weight: 700; }

.quick-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 22px;
}

/* ═══ ÜNİTE VE OYUN KARTLARI ═══ */
.unit-head {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #ffffff;
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border: 3px solid #e2e8f0;
  margin-bottom: 18px;
}
.unit-head .ue { font-size: 48px; }
.unit-head h2 { font-size: 1.4em; font-weight: 900; color: #1e1b4b; }
.unit-head .sub { color: #64748b; font-size: 0.92em; font-weight: 700; }

.unit-grid, .game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}
.card {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 18px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  border: 3px solid #f1f5f9;
  text-align: center;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  position: relative;
}
.card:hover {
  transform: translateY(-4px);
  border-color: #818cf8;
  box-shadow: var(--shadow-md);
}
.card .big { font-size: 44px; display: block; margin-bottom: 6px; }
.card h3 { font-size: 1.05em; font-weight: 900; color: #1e293b; margin-bottom: 4px; }
.card .sub { font-size: 0.84em; color: #64748b; font-weight: 700; }
.ribbon {
  position: absolute;
  top: 10px;
  right: -24px;
  background: #f59e0b;
  color: #ffffff;
  font-size: 0.65em;
  font-weight: 900;
  padding: 3px 26px;
  transform: rotate(45deg);
}

/* ═══ KELİME DUVARI ═══ */
.word-wall {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.word-pill {
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: var(--radius-full);
  padding: 6px 14px;
  font-size: 0.92em;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.15s, background 0.15s;
}
.word-pill:hover {
  background: #fef08a;
  transform: scale(1.06);
}

/* ═══ OYUN EKRANI ═══ */
.game-head {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #ffffff;
  padding: 10px 18px;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-sm);
  border: 2px solid #e2e8f0;
  margin-bottom: 12px;
}
.gscore { font-weight: 900; font-size: 1.05em; color: #1e293b; }
.timerbar {
  width: 100%;
  height: 10px;
  background: #e2e8f0;
  border-radius: 6px;
  overflow: hidden;
}
#gtbi {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #10b981, #3b82f6);
  transition: width 0.3s;
}

.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
}

.prompt-box {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  border: 3px solid #e0e7ff;
  box-shadow: var(--shadow-sm);
  margin-bottom: 18px;
  width: 100%;
  max-width: 600px;
}
.prompt-box .pe { font-size: 48px; display: block; margin-bottom: 6px; }
.prompt-box .pw { font-size: 1.45em; font-weight: 900; color: #1e1b4b; }

.opt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 640px;
}
.opt {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 16px 14px;
  border: 3px solid #cbd5e1;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  transition: transform 0.15s, border-color 0.15s;
  min-height: 80px;
}
.opt:hover { transform: translateY(-3px); border-color: #6366f1; }
.opt .oe { font-size: 34px; line-height: 1.1; }
.opt .ow { font-size: 1.05em; font-weight: 900; color: #1e293b; margin-top: 4px; }
.opt.ok { background: #dcfce7; border-color: #22c55e; color: #15803d; }
.opt.no { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
.opt.sel { border-color: #3b82f6; background: #eff6ff; }

.match-grid {
  display: flex;
  gap: 20px;
  width: 100%;
  max-width: 620px;
  justify-content: center;
}
.match-grid .col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ═══ ŞARKI & CHANT ═══ */
.song-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}
.song-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.song-item {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 14px;
  border: 2px solid #e2e8f0;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s;
}
.song-item:hover { transform: translateY(-3px); border-color: #ec4899; }
.song-item .se { font-size: 32px; display: block; margin-bottom: 4px; }
.song-item h4 { font-size: 1em; font-weight: 900; color: #1e293b; }
.song-item .tune { font-size: 0.82em; color: #64748b; font-weight: 700; }

.player {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-md);
  border: 3px solid #fbcfe8;
  max-width: 680px;
  margin: 0 auto;
  text-align: center;
}
.lyrics {
  background: #fafafa;
  border-radius: var(--radius-md);
  padding: 18px;
  margin: 18px 0;
  max-height: 260px;
  overflow-y: auto;
  border: 2px solid #e2e8f0;
}
.lyrics .line {
  padding: 8px 12px;
  font-size: 1.15em;
  font-weight: 800;
  color: #475569;
  border-radius: 8px;
  transition: background 0.2s, color 0.2s, transform 0.2s;
}
.lyrics .line.active {
  background: #fdf2f8;
  color: #db2777;
  transform: scale(1.04);
}
.player .controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

/* ═══ MODAL & OVERLAY ═══ */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}
.modal {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-float);
  border: 4px solid #818cf8;
  text-align: center;
}
.lvl-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.lvl-pill {
  padding: 10px 18px;
  border-radius: var(--radius-full);
  border: 2px solid #cbd5e1;
  background: #ffffff;
  font-weight: 800;
  font-size: 0.95em;
  cursor: pointer;
  transition: all 0.15s;
}
.lvl-pill:hover, .lvl-pill.active {
  background: #4f46e5;
  color: #ffffff;
  border-color: #4f46e5;
}

/* ═══ SKORLAR & SONUÇLAR ═══ */
.result-stars {
  font-size: 48px;
  margin-bottom: 8px;
  color: #f59e0b;
}
.score-table {
  width: 100%;
  border-collapse: collapse;
  background: #ffffff;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-top: 14px;
}
.score-table th, .score-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid #f1f5f9;
  font-size: 0.92em;
}
.score-table th { background: #f8fafc; font-weight: 900; color: #475569; }

/* ═══ DİNAMİK PARÇACIKLAR & ANİMASYONLAR ═══ */
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 16px;
  top: -20px;
  border-radius: 3px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

.pop-star {
  position: absolute;
  font-size: 24px;
  animation: starPop 0.75s ease-out forwards;
}
@keyframes starPop {
  0% { transform: scale(0.3) translateY(0); opacity: 1; }
  100% { transform: scale(1.4) translateY(-40px); opacity: 0; }
}

.shake-anim { animation: shake 0.45s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}

.fb-flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  animation: fbFade 0.3s forwards;
}
.fb-flash.ok { background: rgba(34, 197, 94, 0.25); }
.fb-flash.no { background: rgba(239, 68, 68, 0.25); }
@keyframes fbFade { to { opacity: 0; } }

.mascot-bubble {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #ffffff;
  border: 3px solid #f59e0b;
  border-radius: 20px;
  padding: 12px 22px;
  font-size: 1.1em;
  font-weight: 900;
  color: #1e1b4b;
  box-shadow: var(--shadow-float);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 150;
}
.mascot-bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.app-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: #1e293b;
  color: #ffffff;
  padding: 10px 20px;
  border-radius: var(--radius-full);
  font-weight: 800;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s;
  z-index: 160;
}
.app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- v2 YENİ ANİMASYONLAR & OYUNLAR ---------- */
.ripple {
  position: fixed;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 4px solid #fde047;
  background: rgba(253, 224, 71, 0.35);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 90;
  animation: rippleOut 0.65s ease-out forwards;
}
@keyframes rippleOut { to { width: 95px; height: 95px; opacity: 0; } }

.flyby {
  position: absolute;
  left: -130px;
  font-size: 46px;
  animation: flyAcross linear forwards;
  filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.15));
  pointer-events: none;
}
@keyframes flyAcross {
  to { transform: translateX(var(--fly, 110vw)) translateY(-40px) rotate(10deg); }
}

.raindrop {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #ffffff;
  border-radius: 18px;
  padding: 8px 13px;
  border: 4px solid #93c5fd;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.12);
  cursor: pointer;
  transition: transform 0.1s;
  animation: bsway 2.2s ease-in-out infinite;
}
.raindrop:hover { transform: scale(1.1); }
.raindrop .re { font-size: 34px; line-height: 1.1; }
.raindrop .rw { font-weight: 900; font-size: 0.82em; }
@keyframes bsway {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

.popflash { animation: popIn 0.4s; }
@keyframes popIn {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.opt:nth-child(1) { animation-delay: 0.03s; }
.opt:nth-child(2) { animation-delay: 0.09s; }
.opt:nth-child(3) { animation-delay: 0.15s; }
.opt:nth-child(4) { animation-delay: 0.21s; }

.gscore .v.bump { display: inline-block; animation: okBounce 0.45s; }
@keyframes okBounce {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); color: #f59e0b; }
  100% { transform: scale(1); }
}

.track {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 6px 0;
  width: 100%;
}
.lane {
  position: relative;
  height: 66px;
  border-radius: 18px;
  border: 4px solid #ffffff;
  overflow: hidden;
  background: repeating-linear-gradient(90deg, #bbf7d0 0 42px, #a3e635 42px 84px);
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.12);
}
.lane.sky {
  background: repeating-linear-gradient(90deg, #bfdbfe 0 42px, #93c5fd 42px 84px);
}
.runner {
  position: absolute;
  top: 7px;
  font-size: 42px;
  transition: left 0.45s cubic-bezier(0.34, 1.3, 0.5, 1);
  filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.25));
}
.lane .fin {
  position: absolute;
  right: 8px;
  top: 6px;
  font-size: 46px;
  animation: pulse 1.4s infinite;
}
.lane-label {
  position: absolute;
  left: 10px;
  top: 8px;
  font-weight: 900;
  background: #ffffff;
  border-radius: 10px;
  padding: 3px 10px;
  font-size: 0.82em;
  z-index: 2;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
}

/* ═══ ANTİ-CRASH KURTARMA KUTUSU ═══ */
#crash-banner {
  display: none;
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: #ffffff;
  border: 4px solid #f43f5e;
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  box-shadow: var(--shadow-float);
  z-index: 9999;
  max-width: 380px;
  text-align: left;
}
#crash-banner.show { display: block; animation: popIn 0.3s; }

  </style>

/* Yardımcı Fonksiyonlar */
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function pick(arr) {
  if (!arr || !arr.length) return null;
  return arr[Math.floor(Math.random() * arr.length)];
}

function sample(arr, n) {
  if (!arr || !arr.length) return [];
  const sh = shuffle([...arr]);
  return sh.slice(0, Math.min(n, sh.length));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rnd(n) {
  return Math.floor(Math.random() * n);
}

function cap(s) {
  if (!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function EWORDS(u) {
  if (!u || !u.w) return [];
  return u.w.filter(w => w[1] && w[1].trim() !== '');
}

function unitById(id) {
  return ALLSETS.find(u => u.id === id) || null;
}

function unitsOfStage(stageId) {
  return ALLSETS.filter(u => u.stage === stageId);
}

/* Kalıcı Hafıza (P0 Dayanıklılık / Anti-Crash) */
const store = {
  _mem: {},
  get(key) {
    try {
      const val = window.localStorage ? localStorage.getItem('polly_' + key) : null;
      return val ? JSON.parse(val) : (this._mem[key] || null);
    } catch (err) {
      return this._mem[key] || null;
    }
  },
  set(key, val) {
    this._mem[key] = val;
    try {
      if (window.localStorage) {
        localStorage.setItem('polly_' + key, JSON.stringify(val));
      }
    } catch (err) {
      // Quota exceeded or private browsing safeguard
    }
  },
  remove(key) {
    delete this._mem[key];
    try {
      if (window.localStorage) {
        localStorage.removeItem('polly_' + key);
      }
    } catch (err) {}
  }
};

   🔊 SES & GÖRSEL EFEKT MOTORU (Web Audio API + TTS + FX)
   Offline çalışır, harici dosya/CDN gerektirmez.
   ============================================================ */

const MEDIA = {
  ctx: null,
  voice: null,
  muted: false,

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return;
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      try {
        this.ctx = new AudioCtx();
      } catch (e) {
        // AudioContext fallback for restricted environments
      }
    }
    this.muted = !!store.get('muted');
  },

  toggleMute() {
    this.muted = !this.muted;
    store.set('muted', this.muted);
    if (this.muted) {
      this.stopSpeak();
    }
    return this.muted;
  },

  tone(freq, delay, dur, type = 'sine', gain = 0.1) {
    if (this.muted || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur);
    } catch (e) {}
  },

  slide(startFreq, endFreq, dur, type = 'sine', gain = 0.1) {
    if (this.muted || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(10, endFreq), t0 + dur);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur);
    } catch (e) {}
  },

  noise(dur, gain = 0.08) {
    if (this.muted || !this.ctx) return;
    try {
      const bufferSize = Math.floor(this.ctx.sampleRate * dur);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(gain, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      noise.connect(g);
      g.connect(this.ctx.destination);
      noise.start();
    } catch (e) {}
  },

  fx(name) {
    if (this.muted) return;
    this.init();
    const T = (f, d, l, tp = 'sine', gn = 0.1) => this.tone(f, d, l, tp, gn);

    switch (name) {
      case 'click':
        T(800, 0, 0.03, 'triangle', 0.08);
        break;
      case 'pop':
        this.slide(400, 1100, 0.08, 'sine', 0.15);
        break;
      case 'correct':
        T(523.25, 0, 0.1, 'triangle', 0.12);
        T(659.25, 0.08, 0.1, 'triangle', 0.12);
        T(783.99, 0.16, 0.22, 'triangle', 0.14);
        break;
      case 'wrong':
        T(220, 0, 0.12, 'sawtooth', 0.1);
        T(185, 0.12, 0.25, 'sawtooth', 0.1);
        break;
      case 'hop':
        this.slide(300, 700, 0.08, 'sine', 0.12);
        break;
      case 'whoosh':
        this.noise(0.12, 0.07);
        break;
      case 'win':
        [523, 659, 784, 1047, 1319].forEach((f, i) => T(f, i * 0.09, 0.22, 'triangle', 0.12));
        break;
      case 'levelup':
        [440, 554, 659, 880].forEach((f, i) => T(f, i * 0.08, 0.2, 'sine', 0.12));
        break;
      case 'team':
        T(440, 0, 0.1, 'square', 0.1);
        T(554, 0.1, 0.1, 'square', 0.1);
        T(659, 0.2, 0.1, 'square', 0.1);
        break;
      case 'catch':
        this.slide(500, 1200, 0.14, 'triangle');
        T(1500, 0.1, 0.08);
        break;
      case 'race':
        this.slide(150, 900, 0.5, 'sawtooth', 0.09);
        this.slide(200, 1100, 0.5, 'sawtooth', 0.07);
        break;
      case 'magic':
        [1047, 1319, 1568, 2093].forEach((f, i) => T(f, i * 0.07, 0.18, 'sine', 0.14));
        break;
      case 'cheer':
        [523, 659, 784, 1047].forEach((f) => T(f, 0, 0.5, 'triangle', 0.09));
        break;
      case 'boing':
        this.slide(500, 150, 0.35, 'sine', 0.2);
        this.slide(300, 90, 0.3, 'sine', 0.12);
        break;
      case 'drip':
        T(1200, 0, 0.06, 'sine', 0.15);
        T(800, 0.05, 0.08, 'sine', 0.12);
        break;
      case 'zoom':
        this.slide(200, 2000, 0.4, 'sawtooth', 0.08);
        break;
      case 'tada':
        [392, 523, 659, 784, 1047].forEach((f, i) => T(f, i * 0.08, 0.25, 'square', 0.1));
        break;
    }
  },

  getVoice() {
    if (!window.speechSynthesis) return null;
    if (this.voice) return this.voice;
    const voices = speechSynthesis.getVoices();
    if (!voices || !voices.length) return null;
    // Prefer English voices: Google, Samantha, Daniel, or en-US/en-GB
    const en = voices.filter((v) => /^en/i.test(v.lang));
    const preferred =
      en.find((v) => /natural|samantha|karen|daniel|google/i.test(v.name)) ||
      en[0] ||
      voices[0];
    this.voice = preferred;
    return preferred;
  },

  speak(text, rate = 0.88, onEnd = null) {
    if (this.muted || !window.speechSynthesis) {
      if (onEnd) setTimeout(onEnd, 300);
      return;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = this.getVoice();
      if (v) u.voice = v;
      u.rate = rate;
      u.pitch = 1.05;
      u.lang = 'en-US';
      if (onEnd) {
        u.onend = () => onEnd();
        u.onerror = () => onEnd();
      }
      speechSynthesis.speak(u);
    } catch (e) {
      if (onEnd) setTimeout(onEnd, 300);
    }
  },

  stopSpeak() {
    if (window.speechSynthesis) {
      try {
        speechSynthesis.cancel();
      } catch (e) {}
    }
  }
};

/* ============================================================
   ✨ GÖRSEL EFEKT SİSTEMİ (Parçacık, Rozet, Bildirimler)

const FX = {
  confetti(count = 45) {
    const L = document.getElementById('fxlayer');
    if (!L) return;
    const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
    const total = Math.min(60, count); // Bounded particle count
    for (let i = 0; i < total; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = rnd(100) + 'vw';
      p.style.backgroundColor = pick(colors);
      p.style.animationDuration = 1.2 + Math.random() * 1.5 + 's';
      p.style.animationDelay = Math.random() * 0.2 + 's';
      L.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }
  },

  stars(x, y) {
    const L = document.getElementById('fxlayer');
    if (!L) return;
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('span');
      s.className = 'pop-star';
      s.textContent = pick(['⭐', '✨', '🌟', '💫']);
      s.style.left = (x || innerWidth / 2) + (rnd(50) - 25) + 'px';
      s.style.top = (y || innerHeight / 2) + (rnd(50) - 25) + 'px';
      L.appendChild(s);
      setTimeout(() => s.remove(), 750);
    }
  },

  notes(x, y) {
    const L = document.getElementById('fxlayer');
    if (!L) return;
    for (let i = 0; i < 4; i++) {
      const n = document.createElement('span');
      n.className = 'pop-star';
      n.textContent = pick(['🎵', '🎶', '🎼']);
      n.style.left = (x || innerWidth / 2) + (rnd(60) - 30) + 'px';
      n.style.top = (y || innerHeight / 2) + (rnd(40) - 20) + 'px';
      L.appendChild(n);
      setTimeout(() => n.remove(), 800);
    }
  },

  shake(el) {
    if (!el) return;
    el.classList.add('shake-anim');
    setTimeout(() => el.classList.remove('shake-anim'), 450);
  },

  fb(ok) {
    const flash = document.createElement('div');
    flash.className = ok ? 'fb-flash ok' : 'fb-flash no';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 300);
  },

  mascotSay(msg, dur = 3200) {
    const m = document.getElementById('mas');
    let b = document.getElementById('mas-bubble');
    if (!b) {
      b = document.createElement('div');
      b.id = 'mas-bubble';
      b.className = 'mascot-bubble';
      document.body.appendChild(b);
    }
    b.textContent = msg;
    b.classList.add('show');
    if (this._mt) clearTimeout(this._mt);
    this._mt = setTimeout(() => {
      b.classList.remove('show');
    }, dur);
  },

  toast(msg, dur = 2200) {
    let t = document.getElementById('app-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'app-toast';
      t.className = 'app-toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    if (this._tt) clearTimeout(this._tt);
    this._tt = setTimeout(() => {
      t.classList.remove('show');
    }, dur);
  }
};

    id: 'mem',

    stages: [1, 2],

        deck.push({ id: w[0], t: 'emoji', content: w[1], w });
      });
      const cards = shuffle(deck);
      let f1 = null, f2 = null, lock = false, pairsFound = 0;

      api.root.innerHTML = `
        <div class="center">
          <div class="prompt-box"><div class="pw">Hafıza Kartları: Eşleri bul! 🧠</div></div>
          <div class="opt-grid" id="mg" style="grid-template-columns:repeat(auto-fit,minmax(90px,1fr));max-width:540px;margin:0 auto">
            ${cards.map((c, i) => `
              <div class="opt memory-card" data-idx="${i}" style="height:100px;font-size:2em;display:flex;align-items:center;justify-content:center;background:#e0e7ff;border:4px solid #818cf8;border-radius:16px;cursor:pointer">

          </div>
        </div>`;

      api.root.querySelector('#mg').onclick = (e) => {
        const elCard = e.target.closest('.memory-card');
        if (!elCard || lock || elCard.classList.contains('matched') || elCard === f1) return;

        const idx = +elCard.dataset.idx;
        const item = cards[idx];
        elCard.querySelector('.card-back').style.display = 'none';
        elCard.querySelector('.card-front').style.display = 'block';
        elCard.style.background = '#ffffff';
        MEDIA.fx('pop');
        if (item.t === 'word') MEDIA.speak(item.content);

        if (!f1) {
          f1 = elCard;
        } else {
          f2 = elCard;
          lock = true;
          const i1 = cards[+f1.dataset.idx];
          const i2 = cards[+f2.dataset.idx];

          if (i1.id === i2.id) {
            f1.classList.add('matched', 'ok');
            f2.classList.add('matched', 'ok');
            MEDIA.fx('correct');
            api.add(15);
            pairsFound++;
            api.progress(pairsFound, cfg.pairs);
            f1 = null;
            f2 = null;
            lock = false;

              setTimeout(() => {
                api.end({ score: api.score, max: cfg.pairs * 15, note: 'Hafıza şampiyonu! 🏆' });

              f2.querySelector('.card-front').style.display = 'none';
              f2.querySelector('.card-back').style.display = 'block';

              lock = false;

          </div>`;

        MEDIA.speak(w[0]);

        const slots = api.root.querySelectorAll('.spell-slot');

          return;

        api.progress(currentIdx + 1, words.length);
        const target = words[currentIdx][0].toUpperCase();
        let clicked = '';

        const letters = target.split('');
        const fillers = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const totalCells = cfg.grid * cfg.grid;
        const gridLetters = [...letters];
        while (gridLetters.length < totalCells) {
          gridLetters.push(pick(fillers.split('')));
        }
        const shuffledGrid = shuffle(gridLetters);

        api.root.innerHTML = `
          <div class="center">
            <div class="prompt-box">
              <span class="pe">${words[currentIdx][1]}</span>
              <div class="pw">Ara: <b style="color:#7c3aed">${target}</b> (${esc(words[currentIdx][2])})</div>

              ${shuffledGrid.map(l => `<button class="btn white g-cell" style="padding:12px;font-size:1.3em;font-weight:900">${l}</button>`).join('')}
            </div>
          </div>`;

        MEDIA.speak(words[currentIdx][0]);
        const statusEl = api.root.querySelector('#srch-status');
        statusEl.textContent = '_ '.repeat(target.length);

        api.root.querySelectorAll('.g-cell').forEach(btn => {
          btn.onclick = () => {
            const letter = btn.textContent.trim();
            const nextExpected = target[clicked.length];
            if (letter === nextExpected) {
              clicked += letter;
              btn.classList.add('ok');
              btn.disabled = true;
              MEDIA.fx('pop');
              statusEl.textContent = clicked + ' _ '.repeat(target.length - clicked.length);

              if (clicked === target) {
                MEDIA.fx('correct');
                FX.stars();
                api.add(15);
                currentIdx++;
                setTimeout(round, 700);
              }
            } else {
              MEDIA.fx('wrong');
              FX.shake(btn);
            }
          };
        });
      };
      round();
    }
  },

  playing: null,
  cleanups: [],

  /* ---------- Navigasyon & Durum Yönetimi ---------- */
  go(scr, p = {}) {
    this.cleanup();
    MEDIA.stopSpeak();
    Object.assign(this, { scr, ...p });
    this.saveState(); // // SAFETY: Her geçişte otomatik durum kaydı
    if (typeof window !== 'undefined' && window.scrollTo) {
      window.scrollTo(0, 0);
    }
    this.render();
  },

  cleanup() {
    this.cleanups.forEach((f) => {
      try {
        f();
      } catch (e) {}
    });
    this.cleanups = [];
  },

  /* // SAFETY: Çökme / Yenilenme Durumunda Kaldığı Yerden Devam */
  saveState() {
    try {
      store.set('last_state', {
        scr: this.scr,
        stage: this.stage,
        unitId: this.unitId,
        engineId: this.engineId,
        lvIdx: this.lvIdx,
        timestamp: Date.now()
      });
    } catch (e) {}
  },

  restoreLastState() {
    const s = store.get('last_state');
    if (s && s.scr && s.scr !== 'home') {
      this.go(s.scr, {
        stage: s.stage,
        unitId: s.unitId,
        engineId: s.engineId,
        lvIdx: s.lvIdx || 0
      });
      FX.toast('Kaldığınız yerden devam ediliyor! 🔄');
      return true;

  },

        if (e.stages.includes(st)) n += e.levels.length;

  /* ---------- Event Bağlama ---------- */
  bind() {
    const $ = (s) => document.querySelector(s),
      $$ = (s) => [...document.querySelectorAll(s)];
    const on = (sel, ev, fn) => {
      const e = $(sel);
      if (e) e.addEventListener(ev, fn);
    };
    const backMap = {
      game: 'unit',
      unit: 'stage',
      stage: 'home',
      player: 'songs',
      songs: 'home',
      scores: 'home',
      help: 'home'
    };

    on('#bk', 'click', () => {
      MEDIA.fx('click');
      this.go(backMap[this.scr] || 'home');
    });
    on('#hm', 'click', () => {
      MEDIA.fx('click');
      this.stage = null;
      this.go('home');
    });
    on('#mu', 'click', (e) => {
      MEDIA.toggleMute();
      e.target.textContent = MEDIA.muted ? '🔇' : '🔊';
      FX.toast(MEDIA.muted ? 'Sesler kapalı 🔇' : 'Sesler açık 🔊');
    });
    on('#mas', 'click', () => {
      const ps = [
        'Hello! I’m Polly! 🦜',
        'Let’s play a game! 🎮',
        'Can you say it? 🗣️',
        'You can do it! 💪',
        'Sing with me! 🎵'
      ];
      const p = pick(ps);
      FX.mascotSay(p);
      MEDIA.speak(p.replace(/[🦜🎮🗣️💪🎵]/g, ''));
    });
    on('#rndG', 'click', () => {
      MEDIA.fx('whoosh');
      const st = pick(STAGES);
      const us = unitsOfStage(st.id);
      const u = pick(us);
      const stn = st.id === 's1' ? 1 : 2;
      const e = pick(ENGINES.filter((x) => x.stages.includes(stn)));
      const lv = rnd(e.levels.length);
      this.stage = st.id;
      this.go('game', { unitId: u.id, engineId: e.id, lvIdx: lv });
    });
    on('#sc', 'click', () => this.go('scores'));
    on('#hp', 'click', () => this.go('help'));

    $$('.stage-card').forEach((c) =>
      c.addEventListener('click', () => {
        MEDIA.fx('whoosh');
        if (c.dataset.go) return this.go('songs');
        this.stage = c.dataset.st;
        this.go('stage');
      })
    );

    $$('.card[data-u]').forEach((c) =>
      c.addEventListener('click', () => {
        MEDIA.fx('pop');
        this.go('unit', { unitId: c.dataset.u });
      })
    );

    $$('.word-pill[data-w]').forEach((p) =>
      p.addEventListener('click', () => {
        MEDIA.speak(p.dataset.w);
        FX.notes(innerWidth / 2, innerHeight - 140);
      })
    );

    $$('.card[data-e]').forEach((c) =>
      c.addEventListener('click', () => {
        MEDIA.fx('pop');
        this.pickLevel(c.dataset.e);
      })
    );

    $$('.lvl-pill[data-st]').forEach((b) =>
      b.addEventListener('click', () => {
        this.songFilter = { stage: b.dataset.st, unit: null };
        this.go('songs');
      })
    );

    $$('.word-pill[data-sunit]').forEach((b) =>
      b.addEventListener('click', () => {
        this.songFilter.unit = b.dataset.sunit;
        this.go('songs');
      })
    );

    $$('.song-item[data-song]').forEach((s) =>
      s.addEventListener('click', () => {
        MEDIA.fx('click');
        this.playing = SONGS[+s.dataset.song];
        this.go('player');
      })
    );

    $$('.song-item[data-chant]').forEach((s) =>
      s.addEventListener('click', () => {
        MEDIA.fx('click');
        this.playing = ALLCHANTS[+s.dataset.chant];
        this.go('player');
      })
    );

    on('#rst', 'click', () => {
      if (confirm('Tüm skorlar silinsin mi?')) {
        store.set('best', {});
        this.go('scores');
      }
    });

    if (this.scr === 'game') this.mountGame();
    if (this.scr === 'player') this.mountPlayer();
  },

  /* ---------- Seviye Seçme Modalı ---------- */
  pickLevel(eid) {
    const e = ENGINES.find((x) => x.id === eid);
    if (!e) return;
    const ov = el(`<div class="overlay"><div class="modal">
     <h3>${e.e} ${e.t}</h3><div class="muted" style="margin-bottom:10px">${e.d}</div>
     <div class="lvl-row" style="justify-content:center">${e.levels
       .map(
         (l, i) =>
           `<button class="lvl-pill" data-l="${i}">${'🟢🟡🔴'[i] || '🎯'} ${l.n}</button>`
       )
       .join('')}</div></div></div>`);
    document.body.appendChild(ov);
    ov.addEventListener('click', (ev) => {
      if (ev.target === ov) ov.remove();
      const b = ev.target.closest('[data-l]');
      if (b) {
        ov.remove();
        MEDIA.fx('whoosh');
        this.go('game', { engineId: eid, unitId: this.unitId, lvIdx: +b.dataset.l });
      }
    });
  },

  /* ---------- Oyunu Başlat ---------- */
  mountGame() {
    const area = document.getElementById('garea');
    if (!area) return;
    const u = unitById(this.unitId),
      e = ENGINES.find((x) => x.id === this.engineId);
    if (!u || !e) return;
    const self = this;
    let score = 0;

    const upd = () => {
      const s = document.getElementById('gsc');
      if (s) {
        s.textContent = score;
        s.classList.remove('bump');
        void s.offsetWidth;
        s.classList.add('bump');
      }
    };

    const api = {
      root: area,
      unit: u,
      lv: e.levels[this.lvIdx] ? e.levels[this.lvIdx].c : {},
      score: 0,
      add(n) {
        score += n;
        this.score = score;
        upd();
        if (score > 0 && score % 60 === 0) {
          const p = pick(PRAISE);
          FX.mascotSay(p + ' 🦜');
          MEDIA.speak(p);
          FX.confetti(30);
          MEDIA.fx('cheer');
        }
      },
      progress(c, t) {
        const p = Math.min(100, Math.round((c / t) * 100));
        const b = document.getElementById('gtbi');
        if (b) b.style.width = p + '%';
        const pc = document.getElementById('gpc');
        if (pc) pc.textContent = p + '%';
      },
      info(html) {
        const i = document.getElementById('ginfo');
        if (i) {
          i.innerHTML = html;
          return i.firstElementChild || i;
        }
        return null;
      },
      speak: (t, r, cb) => MEDIA.speak(t, r, cb),
      fx: (n) => MEDIA.fx(n),
      cleanup(f) {
        self.cleanups.push(f);
      },
      restart() {
        self.go('game', {
          engineId: self.engineId,
          unitId: self.unitId,
          lvIdx: self.lvIdx
        });
      },
      end(res) {
        self.cleanup();
        MEDIA.stopSpeak();
        const pct = res.max ? res.score / res.max : 1;
        const st = pct >= 0.85 ? 3 : pct >= 0.55 ? 2 : 1;
        const key = e.id + '|' + u.id + '|' + self.lvIdx,
          b = store.get('best') || {};
        if (!b[key] || b[key].s < res.score) {
          b[key] = { s: res.score, st: Math.max(st, b[key] ? b[key].st : 0) };
          store.set('best', b);
        } else if (b[key].st < st) {
          b[key].st = st;
          store.set('best', b);
        }
        FX.confetti(st * 50);
        MEDIA.fx(st >= 2 ? 'win' : 'levelup');
        area.innerHTML = `<div class="center">
         <div class="result-stars">${'⭐'.repeat(st) + '<span>☆</span>'.repeat(3 - st)}</div>
         <div class="pw" style="font-size:1.5em">Puan: ${res.score}</div>
         <div class="muted">${res.note || ''}</div>
         <div class="row" style="display:flex;gap:10px;margin-top:16px"><button class="btn green" id="rag">🔁 Tekrar Oyna</button>
           <button class="btn blue" id="run">➡️ Diğer Oyunlar</button></div></div>`;
        const rag = area.querySelector('#rag');
        if (rag) rag.onclick = () => api.restart();
        const run = area.querySelector('#run');
        if (run) run.onclick = () => self.go('unit', { unitId: u.id });
      }
    };

    upd();
    try {
      e.init(api);
    } catch (err) {
      // // SAFETY: Motor hata verse dahi beyaz ekran olmasını engelle
      area.innerHTML = `<div class="center"><div class="big-emoji">🙈</div>
     <div>Bu oyunda bir aksilik oldu. Diğer oyunları deneyin!</div><div class="muted">${esc(err.message)}</div></div>`;
    }
  },

  /* ---------- Şarkı Oynatıcı ---------- */
  mountPlayer() {
    const s = this.playing;
    if (!s) return;
    let idx = 0,
      slow = false,
      running = false,
      timer = null;
    const lines = [...document.querySelectorAll('#ly .line')];
    const stop = () => {
      running = false;
      clearTimeout(timer);
      MEDIA.stopSpeak();
      lines.forEach((l) => l.classList.remove('active'));
    };
    this.cleanups.push(stop);

    const step = () => {
      if (!running) return;
      if (idx >= lines.length) {
        stop();
        FX.mascotSay('Bravo! 🎉 Bir daha söyleyelim mi?');
        return;
      }
      lines.forEach((l) => l.classList.remove('active'));
      const ln = lines[idx];
      if (ln) {
        ln.classList.add('active');
        if (ln.scrollIntoView) {
          try {
            ln.scrollIntoView({ block: 'center', behavior: 'smooth' });
          } catch (e) {}
        }
        FX.notes(innerWidth / 2, innerHeight - 160);
        const txt = ln.textContent.replace(/[^\w\s'’,.!?-]/g, '').trim() || 'la la la';
        MEDIA.speak(txt, slow ? 0.7 : 0.85, () => {
          if (!running) return;
          timer = setTimeout(() => {
            idx++;
            step();
          }, 550);
        });
      }
    };

    const pp = document.getElementById('pp');
    if (pp) {
      pp.onclick = () => {
        MEDIA.fx('click');
        running = true;
        idx = 0;
        step();
      };
    }
    const pr = document.getElementById('pr');
    if (pr) {
      pr.onclick = () => {
        MEDIA.fx('click');
        stop();
        running = true;
        idx = 0;
        setTimeout(step, 150);
      };
    }
    const ps = document.getElementById('ps');
    if (ps) {
      ps.onclick = (e) => {
        slow = !slow;
        e.target.textContent = slow ? '🐇 Normal' : '🐢 Yavaş';
        MEDIA.fx('click');
      };
    }
    const pa = document.getElementById('pa');
    if (pa) {
      pa.onclick = () => {
        MEDIA.fx('click');
        stop();
      };
    }
  },

  /* ---------- Gökyüzü Dekoru (P1: Düşük CPU / RAM) ---------- */
  floaties() {
    const f = document.getElementById('floaties');
    if (!f) return;
    const em = ['☁️', '🎈', '⭐', '🦋', '🪁', '🌸', '🍃', '💫', '🐝', '☁️'];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span');
      s.textContent = em[i % em.length];
      s.style.left = Math.random() * 96 + '%';
      s.style.fontSize = 24 + Math.random() * 24 + 'px';
      s.style.animationDuration = 14 + Math.random() * 14 + 's';
      s.style.animationDelay = -Math.random() * 18 + 's';
      f.appendChild(s);
    }
  }
};

    banner.classList.add('show');

    if (resBtn) {
      resBtn.onclick = () => {
        banner.classList.remove('show');
        APP.restoreLastState();
      };
    }
    const hmBtn = document.getElementById('crash-home');
    if (hmBtn) {
      hmBtn.onclick = () => {
        banner.classList.remove('show');
        APP.go('home');
      };
    }
  }
});

  'pointerdown',
  (ev) => {

    const r = document.createElement('i');
    r.className = 'ripple';
    r.style.left = ev.clientX + 'px';
    r.style.top = ev.clientY + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 700);
  },
  { passive: true }
);

// // PERF: Uçan maskotlar arka planda çalışmaz, maksimum 2 eleman sınırı

  const L = document.getElementById('fxlayer');

    const b = document.createElement('span');

}, 9000);

  document.addEventListener('click', () => MEDIA.init(), { once: true });
  if (typeof window !== 'undefined' && window.speechSynthesis) {
    try {
      speechSynthesis.onvoiceschanged = () => {
        MEDIA.voice = null;
      };
    } catch (e) {}
  }
  FX.mascotSay('Merhaba! Ben Polly 🦜 Bir sınıf seç ve başlayalım!', 4500);
}
